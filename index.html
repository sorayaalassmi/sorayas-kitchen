## How to use this book

Tap a recipe to open it. The search box matches titles, ingredients and tags, and the tag buttons filter the whole book.

- **Low calorie** means under 400 kcal a serving for a meal, or under 150 for a snack or dessert.
- **High protein** means 20g or more a serving for a meal, or 10g or more for a snack or dessert.
- Nutrition figures are estimates from standard ingredient values, so check your own labels for exact numbers.
- Temperatures are for a conventional oven in °C. For a fan oven, reduce by about 20°C.

# Breakfast

## 1. Açaí Bowl

_A single-packet Sambazon bowl, blended thick like soft-serve._

Serves 1 · Prep 5 min

Tags: Breakfast, Low calorie

**Ingredients**

- 1 Sambazon frozen açaí packet (unsweetened if you have it)
- ½ small frozen banana
- 1–2 tbsp milk — truly just a splash
- Optional: 15g vanilla protein powder or 1 tbsp Greek yogurt
- Toppings: sliced banana, berries, granola, peanut butter, coconut flakes

**Method**

1. **Chill the bowl** — 5 minutes in the freezer makes a real difference.
2. **Break up the açaí** — Warm water over the sealed packet for 5 seconds, snap into chunks into the food processor with the banana.
3. **Blend thick** — Pulse to rubble, add 1 tbsp milk (and the powder), run in short bursts, scraping down, until creamy soft-serve. Add the second tablespoon only if it genuinely won't come together.
4. **Top and eat** — Into the chilled bowl, toppings on.

**Nutrition (approx.)**

Per 100g (base): ~105 kcal · 8g protein with powder.

Whole base with powder: ~190 kcal · 15g protein. Without: ~130 kcal. Toppings extra.

**Notes**

Unsweetened packet ~70 kcal; Original with cane sugar ~100 kcal.

The food processor beats a regular jug blender for thick, low-liquid mixtures. A tamper blender is better still; a bullet works with pulse-and-shake.

## 2. Foul Medames

_The breakfast bowl — warm fava beans with garlic, cumin, and lemon, topped with fresh tomato and parsley._

Serves 2 · Prep 5 min · Cook 5 min

Tags: Breakfast, Middle Eastern, Low calorie

**Ingredients**

- 1 can foul medames (~400g), drained but keep a little liquid
- 1–2 tbsp tomato purée
- 2 garlic cloves, crushed
- ½ tsp ground cumin
- ½ tsp Bahraini spice mix (بهارات بحرينية)
- Juice of ½ lemon
- 1 tbsp olive oil, plus a drizzle to finish
- Salt and black pepper

**To top**

- 1 tomato, chopped
- A handful of parsley, chopped
- ½ small red onion, finely chopped
- A drizzle of tahina (optional)
- Khubz, and optionally a soft-boiled egg each

**Method**

1. **Warm** — Beans in a small pot with a splash of their liquid, the tomato purée, garlic, cumin, and Bahraini spice mix, about 5 minutes. The purée deepens the colour and rounds off the beans, the way it's usually served in Bahrain.
2. **Mash** — About half the beans against the side of the pot — part-creamy, part-whole, never a purée.
3. **Season** — Lemon, olive oil, salt, pepper.
4. **Top and serve** — Shallow bowl, scatter over tomato, parsley, onion, finish with oil or tahina. Egg on top for protein; khubz alongside.

**Nutrition (approx.)**

Per 100g: ~120 kcal · 7g protein.

Per serving: ~260 kcal · 15g protein — with an egg, ~330 kcal and 21g protein.

Tahina: 1 tsp is ~30 kcal; 1 tbsp ~90 kcal.

**Notes**

Leftovers blitz into a dip with extra lemon and garlic, or fill a khubz wrap with a spoon of sahawig.

## 3. Labneh with Olives

_A mezze plate of labneh under olives, walnuts, and za'atar, finished with pomegranate molasses._

Serves 6 as a mezze · Prep 10 min · No cooking

Tags: Breakfast, Middle Eastern, Dips, Low calorie

**Ingredients**

- 1 tub labneh (~400g)
- 70g black olives (½ cup), chopped
- 60g walnuts (½ cup), chopped
- 2 tbsp olive oil
- 2 tsp za'atar
- 2 tsp sumac
- 1 tbsp pomegranate molasses
- 1 tsp dried mint (optional)
- Khubz, to serve

**Method**

1. **Spread the labneh** — Onto a flat plate, pushing it out to the edges with the back of a spoon and leaving a shallow well in the middle.
2. **Scatter the olives** — Evenly over the surface.
3. **Sprinkle the dry things** — Walnuts first, then the za'atar, sumac, and mint over the top. Keep them loose and separate rather than pre-mixed.
4. **Drizzle the oil** — Olive oil over everything.
5. **Drizzle the molasses** — Pomegranate molasses last, in thin lines rather than a pool.
6. **Serve** — With khubz for scooping.

**Nutrition (approx.)**

Per 100g: ~245 kcal · 6.3g protein · 22g fat · 6.5g carbs.

Per serving (⅙, ~100g): ~240 kcal · 6g protein.

**Notes**

From Soraya's recipe card.

Everything goes on in layers rather than pre-mixed in a bowl. Once the olives and walnuts are coated in oil they clump, and trying to spread that lump drags and tears the labneh underneath.

The molasses goes on last and stays on top — mixed in early it stains everything muddy brown and you lose the contrast against the white labneh.

Walnuts and olive oil carry most of the calories, so a lighter version is mostly about the walnuts: halving them to 30g takes it to about 210 a serving.

Toasting the walnuts in a dry pan for 3–4 minutes first is the difference between soft and fragrant.

## 4. Banana Oat Protein Bake

_A microwave banana-bread-style bowl, ready in 2 minutes._

Serves 1 · 410 kcal a bowl

Tags: Breakfast, High protein

**Ingredients**

- 40 g oats (½ cup)
- ½ ripe banana
- 1 scoop vanilla protein powder (about 30 g)
- Stevia to taste
- ¼ tsp baking soda
- 80 ml skimmed milk (⅓ cup)
- Pinch of salt
- ¼ tsp cinnamon
- 1 tbsp chocolate chips
- Spray oil, for greasing

**Method**

1. Blend everything except the chocolate chips for 15–20 seconds until smooth.
2. Grease a microwave-safe bowl with spray oil, pour in the batter and top with the chocolate chips.
3. Microwave for 1 minute, then in 30-second bursts until done. 1½ minutes gives a gooey texture and 2 minutes a cakey one.

**Nutrition**

Per bowl: 410 kcal · 34 g protein · 54 g carbs · 8 g fat

Per 100g: 200 kcal · 17 g protein · 26 g carbs · 4 g fat

**Notes**

- Using 1 tbsp maple syrup or honey instead of stevia adds about 50 kcal.
- The chocolate chips are about 60 kcal, so using half is an easy saving.

# Mains

## 5. Bahraini Tikka Lumee

_Beef skewer cubes marinated in loomi (dried lime), garlic, and warm spices — Bahrain's beloved street food, eaten wrapped in khubz._

Serves 4 · Prep 15 min · Marinate 1–4 hrs · Cook 10 min

Tags: Mains, Bahraini, Low calorie, High protein, Air fryer

**Ingredients**

- 600g beef tenderloin or fillet, cut into 2.5cm cubes
- 2 tbsp garlic and ginger paste
- 2 tbsp ground loomi (dried lime)
- 1 tbsp freshly ground black pepper
- 1 tsp ground cumin
- 1 tsp lemon salt (citric salt), or to taste
- 2 tbsp olive oil

**To serve**

- Khubz or other flatbread
- Raw red onion, sliced
- Tomatoes, sliced
- Bagel (بقل) — fresh young leeks, cut into long strips

**Method**

1. **Make the marinade** — Mix the garlic and ginger paste, ground loomi, black pepper, cumin, lemon salt, and olive oil into a thick paste.
2. **Marinate** — Add the beef and massage the marinade in so every piece is coated. Cover and refrigerate at least 1 hour but no more than 3–4 hours — the acidity of the loomi will over-tenderise the beef if left longer.
3. **Air fry** — Spread the cubes in a single layer in the air fryer basket. Air fry at 200°C for 8–10 minutes, shaking halfway, until browned outside and just slightly pink inside.
4. **Serve** — Drizzle over any juices and serve hot with khubz, sliced onion, tomato, and strips of bagel. Eat it wrapped in the bread — the loomi is sharp on its own, and the bread is what makes it sing.

**Variations**

Oven roast: on a wire rack over a lined tray at 220°C fan for 10–12 minutes, turning once. For extra char, finish 1–2 minutes under a hot grill.

Traditional barbecue: five cubes per skewer (soak wooden skewers 20 minutes first), charcoal at medium-high, 3–4 minutes per side.

**Nutrition (approx.)**

Per 100g (raw marinated weight): ~175 kcal · 19g protein · 10g fat · 2g carbs.

Per serving (¼): ~290 kcal · 32g protein. Khubz and vegetables extra — roughly 250–300 kcal per large flatbread.

**Notes**

Loomi is whole lime boiled in salted water and sun-dried, giving the tikka its sharp, smoky-citrus tang. Find it ground at Middle Eastern grocers, or grind whole dried limes (seeds removed).

## 6. Bahraini Chicken Saloona

_The family saloona — a tamarind-and-black-lemon chicken stew loaded with vegetables, made light with water-caramelised onions and chicken breast._

Serves 4 · Prep 20 min · Cook ~60 min

Tags: Mains, Bahraini, Low calorie, High protein

**Ingredients**

- 500g chicken breast, cut into large 3–4cm chunks
- 1½ tbsp olive oil
- 1 red onion, chopped
- 1 bay leaf
- 1 tsp garlic and ginger paste
- 1 tsp hasheesh paste
- 2 black lemons (loomi), pierced
- 2 very large tbsp tomato paste
- 2 tomatoes, shredded
- 40g tamarind, diluted in 2 cups warm water and strained
- 1 bunch coriander, soaked and chopped, plus extra to garnish
- Hard veggies, in chunks: 2 carrots, 2 potatoes, 200g green beans
- Soft veggies, in chunks (a handful each): pumpkin, cauliflower, okra, green capsicum
- Chicken stock or water, to cover (~750ml)

**Spices**

- Pinch of salt
- ½ tsp cinnamon
- ½ tsp black pepper
- 1 tsp garam masala
- 1 tsp Bahraini spice mix (بهارات بحرينية)
- 1 tsp jiljilan and sanoot mix
- ½ tsp turmeric

**Method**

1. **Caramelise the onion, water only** — Onion and bay leaf in a dry saucepan on medium-high. Cook until dry, add a dash of water, repeat about 6 times until browned and caramelised.
2. **Brown the chicken** — Add the olive oil and both pastes, fry a few seconds, then the chicken, browning 2–3 minutes on the outside only. Lift out and set aside.
3. **Spices in** — Add the pierced black lemons and all spices except salt; stir until fragrant.
4. **Tomato** — Add the shredded tomato and tomato paste, mix well.
5. **Hard veggies** — Add carrots, potatoes, green beans; cover with stock and cook medium-high until just tender, 7–10 minutes.
6. **Soft veggies and tamarind** — Add coriander, soft veggies, salt, and strained tamarind water. Simmer low about 20 minutes, returning the chicken for the final 10–12.
7. **Serve** — Squeeze the black lemons against the pot, garnish with coriander, serve with rice or khubuz argag.

**Nutrition (approx.)**

Per 100g: ~55 kcal · 5g protein · 1g fat · 6g carbs.

Per serving (¼ pot, without rice): ~375 kcal · 32g protein.

**Notes**

From the family recipe card, scaled to 4 servings.

The hard/soft veggie lists are a framework — use half of each hard veggie and a handful of each soft one you have.

## 7. Paprika and Parmesan Chicken Nuggets

_Juicy air-fried nuggets in a parmesan-oat crumb — no warm spice, just savoury. The oat coating from the original, with the dryness fixed._

Serves 4 (makes ~20 nuggets) · Prep 20 min · Cook 8–10 min

Tags: Mains, Low calorie, High protein, Air fryer

**Ingredients**

- 500g chicken thigh, boneless, in chunks
- 120g Greek yogurt
- 1 tsp olive oil
- 1 tsp garlic and ginger paste
- Squeeze of lemon juice
- 1 tsp sweet paprika
- ½ tsp salt, plus a pinch of black pepper
- 80g rolled oats (20g for the panade, 60g for the coating)
- 3 tbsp milk, for the panade
- 25g parmesan, finely grated, for the coating
- Olive oil spray
- Dip: Greek yogurt, a tiny bit of garlic, squeeze of lemon

**Method**

1. **Make the panade** — Blitz all 80g of oats to fine crumbs. Soak 20g of the crumbs in the 3 tbsp of milk for 5 minutes — this is what keeps the nuggets moist.
2. **Make the coating** — Mix the remaining 60g of crumbs with the parmesan and tip onto a plate.
3. **Make the nugget mix** — Pulse the chicken with the yogurt, oil, garlic-ginger paste, lemon, paprika, salt, pepper, and the soaked panade to a coarse mince — pulse, don't purée. Paste cooks dry.
4. **Shape and coat** — With damp hands, shape into about 20 nuggets, a little thicker than you think, and roll in the parmesan crumb.
5. **Air fry** — Spray lightly and air fry at 190°C for 8–10 minutes, flipping halfway, until golden and just cooked — 74°C inside, no further. Oven: 220°C on a wire rack over a tray, 15–18 minutes.
6. **Serve** — Rest 2 minutes, then serve with the yogurt dip.

**Nutrition (approx.)**

Per 100g: ~180 kcal · 20g protein · 8g fat · 9g carbs.

Per serving (5 nuggets): ~250 kcal · 29g protein.

**Notes**

Why this version: the first used breast with only 60g of yogurt at 200°C for 12 minutes — three reasons to be dry. Thigh, a milk-soaked oat panade, double the yogurt, and a lower, shorter cook fix it.

Freeze cooked nuggets flat, then bag — 2 months, reheating from frozen in the air fryer at 180°C for 5–6 minutes. The air fryer beats the oven for reheating.

## 8. Mini Kofta Meatballs

_Little kofta with zucchini and carrot hidden inside, served with a yogurt-mint dip._

Serves 4 (makes ~24 minis) · Prep 20 min · Cook 8–18 min

Tags: Mains, Middle Eastern, Low calorie, High protein, Air fryer

**Ingredients**

- 500g lean beef mince (5% fat) or chicken mince
- 1 small zucchini (~150g), grated and squeezed very dry
- 1 carrot, finely grated
- ½ white onion, grated
- 1 egg
- 20g rolled oats, blitzed to crumbs
- 1 tsp garlic and ginger paste
- 2 tbsp chopped parsley or coriander
- ½ tsp ground cumin
- ½ tsp paprika
- ¼ tsp cinnamon
- ½ tsp salt, plus pepper
- Dip: 150g Greek yogurt, dried mint, squeeze of lemon, pinch of salt

**Method**

1. **Squeeze the zucchini** — Squeeze the grated zucchini very hard in a clean towel. This is what keeps the meatballs from going soggy.
2. **Mix** — Combine everything with the mince, mixing the meat by hand so it doesn't toughen.
3. **Roll** — Roll into about 24 mini meatballs.
4. **Cook** — Air fryer: 190°C for 8–10 minutes, shaking halfway. Oven: 200°C for 15–18 minutes on a lined tray, no turning needed, with 2 minutes under the grill at the end for colour.
5. **Serve** — Stir the dip together and serve alongside.

**Nutrition (approx.)**

Per 100g: ~110 kcal · 15g protein · 4g fat · 5g carbs.

Per serving (6 meatballs, without dip): ~220 kcal · 29g protein. The dip adds ~25 kcal.

**Notes**

Air fryer gives a slightly better crust; the oven fits all 24 on one tray, which wins for a double batch. Inside, they're identical.

Freeze cooked meatballs flat, then bag — 2 months, reheating from frozen in the air fryer at 180°C in 5–6 minutes.

## 9. Lean Beef Burgers

_A full burger build with a hard-seared lean patty, lighter burger sauce, and all the fixings._

Serves 4 · Prep 15 min · Cook ~10 min

Tags: Mains, High protein

**Patties**

- 600g lean beef mince (5% fat)
- ½ white onion, finely grated
- 1 tsp garlic and ginger paste
- 1 tsp paprika, ½ tsp salt, a good grind of black pepper
- 1 tsp oil, for the pan

**Lighter burger sauce**

- 4 tbsp Greek yogurt
- 1 tbsp light mayo
- 1 tbsp ketchup
- 1 tsp mustard
- 1 small pickle, finely chopped, plus a pinch of paprika

**Build**

- 4 whole wheat burger buns (~60g each)
- 4 slices reduced-fat cheddar (20g each) — optional
- Lettuce, sliced tomato, red onion rings, extra pickles

**Method**

1. **Make the patties** — Mix the mince gently with the grated onion, paste, and seasoning — don't overwork it. Shape 4 patties slightly wider than the buns and press a dimple in the centre of each so they stay flat.
2. **Fry** — Nonstick or stainless on medium-high; stainless needs a proper preheat (a drop of water should bead and dance), then add the oil. Fry 3–4 minutes per side without pressing, to 75°C inside. In stainless they stick at first and release once the crust forms — if you have to pry, they're not ready. Cheese on for the final minute, pan covered.
3. **Toast the buns** — Cut-side down in the meat juices, 30–60 seconds.
4. **Build** — Sauce, lettuce, patty with cheese, tomato, onion, pickles, more sauce, lid on.

**Nutrition (approx.)**

Per 100g: ~165 kcal · 17g protein · 6g fat · 12g carbs.

Per full burger with cheese and sauce: ~460 kcal · 45g protein. Without cheese: ~400 kcal.

**Notes**

Raw patties freeze well between parchment squares — cook from frozen, adding 3–4 minutes.

Smash-style minis for the kids: halve each patty, flatten thin, fry 5–6 minutes total.

## 10. Molokhia with Vermicelli Rice

_Soraya's molokhia in three parts: the silky green soup, the sizzling garlic-coriander tasha poured over the top, and vermicelli rice underneath._

Serves 4 · Prep 15 min (plus 30 min rice drying) · Cook ~40 min

Tags: Mains, Middle Eastern

**Part 1 · Molokhia**

- 400g minced molokhia, frozen
- 2 garlic cloves, minced
- ½ tsp ground coriander
- 2–3 cups chicken stock
- 1½ tbsp ghee
- 1 shredded tomato

1. **Garlic in ghee** — Ghee in the pot, then the minced garlic; cook 30 seconds.
2. **Coriander** — Add the ground coriander and mix.
3. **Stock** — Add 2–3 cups chicken stock and bring to the boil.
4. **Molokhia** — Add the frozen molokhia, medium heat until melted, then low; add the tomato.
5. **Simmer** — 5–8 minutes, using a ladle to stir and mix well.

**Part 2 · Tasha**

- 1 tbsp ghee
- 4 cloves garlic, chopped
- 1½ tsp ground coriander

1. **Fry and pour** — While the molokhia simmers, melt the ghee in a small pan, add the garlic and coriander, fry until gold and bubbly, then pour over the finished molokhia in the serving bowl.

**Part 3 · Vermicelli Rice**

- 1 cup Egyptian or Japanese sushi rice
- ⅓ cup short vermicelli
- 250ml chicken stock + 250ml water
- 1 tbsp ghee/butter
- 1 tbsp vegetable oil
- 1 tsp salt

1. **Wash and dry** — Wash the rice 3 times till clear and leave to dry at least 30 minutes in a sieve.
2. **Ghee and oil** — Into a pot with a tight-fitting lid on medium heat.
3. **Toast** — Once melted, fry the vermicelli 2–3 minutes until half golden. Add the rice and fry until pearlescent.
4. **Flatten** — Flatten into an even layer.
5. **Stock** — Pour in stock and water until covered by 2cm above rice level; add salt.
6. **Boil** — Lid on, until the water has evaporated.
7. **Steam** — Lowest setting for 20 minutes.

**Nutrition (approx.)**

Molokhia — per 100g: ~35 kcal · 1.5g protein. Per serving (¼ pot): ~100 kcal · 4g protein.

Tasha — per 100g: ~525 kcal (nearly all ghee). Per serving (¼): ~40 kcal.

## 13. Hidden Veg Tomato Sauce

- 1 large white onion, chopped
- 4 garlic cloves, freshly crushed

- 2 celery sticks, chopped

## 14. Slow Soffritto Tomato Base

_The Italian way round: vegetables cooked down slowly into whole peeled tomatoes, simmered until the oil separates, then blended smooth for the freezer._

Makes ~2 litres (about 8 portions) · Prep 20 min · Cook ~1 hr 50 min

Tags: Mains, Low calorie

**Ingredients**

- 3 tbsp olive oil
- 2 large white onions (~350g), finely chopped
- 3 carrots (~250g), finely chopped
- 3 celery sticks (~180g), finely chopped
- 6 garlic cloves, crushed — or 6 frozen garlic cubes
- 1½ tbsp tomato paste
- 2 × 400g cans whole peeled tomatoes, not chopped
- 1 × 700g jar passata
- 150ml water
- 1 bay leaf, 1 sprig rosemary
- ½ tsp salt, to finish
- Fresh basil, torn, at serving

**Method**

1. **Chop** — Onion, carrot and celery fine in the food processor. It gets blended later, so size matters less than evenness.
2. **Soffritto** — All three into the oil on low with a pinch of salt, 25–30 minutes until soft, sweet and collapsing. Not browned. This is the whole recipe; rushing it to five minutes is the difference between flat and deep.
3. **Garlic and paste** — Both in together, 2 minutes, until the paste darkens and smells nutty. Frozen garlic goes in at this stage, not earlier — it is already crushed and catches fast.
4. **Tomatoes** — Crush the whole tomatoes in your hand straight into the pan. Passata, then the water swirled round the cans and jar. Bay and rosemary.
5. **Simmer** — Lowest heat, part-covered, 1 hr 15 min. Done when the oil separates and pools slightly at the edges — the traditional sign, worth waiting for.
6. **Blend and season** — Remove the bay and the rosemary stalk, blend smooth, then salt lightly. Basil only at the plate.

**Batch and freeze**

Cool completely, then flat bags stacked like books — they thaw in minutes. 6 months. No basil, no cream, no cheese before freezing; basil blackens and dairy splits. Reheat low with a splash of water. Fridge 5 days.

**Nutrition (approx.)**

Per 100g: ~50 kcal · 1.2g protein. Per portion (~250g): ~125 kcal.

**Variations**

Chilli and parsley stirred through a portion makes arrabbiata. Brown mince separately and add a portion for a fast ragù. Lentils or mushrooms for a meat-free one. Loosened with stock it is tomato soup; reduced down thicker it is a pizza base.

Rose harissa is the best of these. Warm 1 tsp oil in the pan, add 2 tsp rose harissa and let it sizzle 30 seconds until the oil runs red, then pour in 500ml of defrosted base. Blooming it matters — there are whole spices in there that need heat to open up. Lemon at the end, and a spoonful of yoghurt or cream at the plate, which turns it silky and slightly pink. Start at 2 tsp per 500ml and taste; it tips into tasting soapy if you overdo it. Roasted red pepper alongside it is very good.

Plain harissa is fiercer and far less fragrant. Keep that one for shakshuka and the chilli.

**Notes**

Whole peeled cans, never chopped. Chopped cans usually carry calcium chloride, a firming salt that stops the cubes breaking down, which is exactly what you want them to do here. The fruit in them is lower grade too. Crushing whole ones by hand takes thirty seconds.

Passata is only sieved tomatoes — read the back and buy one listing tomatoes alone. It is there for smooth volume; the canned whole tomatoes are there for depth. Using only cans gives a looser sauce that needs another half hour.

White onion because that is what Bahrain sells. Brown is sweeter over a long simmer, so give the white an extra five minutes in the oil to make up for it. Red goes grey.

Salted lightly on purpose — season the plate, not the batch, so it suits him and still tastes right to you.

Harissa is not a substitute for the tomato paste. It is a chilli paste, not concentrated tomato, so swapping it in loses the body and the savoury backbone. Add it as well, or better, at the portion.

Blended smooth like #12, but a different sauce underneath: no capsicum or zucchini, whole tomatoes instead of chopped, and nearly two hours instead of forty minutes. #12 is the weeknight one; this is the Sunday one.

## 15. Chilli con Carne

_Built on a defrosted portion of #13, so the onion, garlic and tomato work is already done. One pan, an hour, better the next day._

Serves 4 · Prep 10 min · Cook ~1 hr

Tags: Mains, High protein

**Ingredients**

- 1 tbsp olive oil
- 500g beef mince, 15–20% fat
- 1 large red capsicum (~150g), chopped — straight from frozen is fine
- 1 packet chilli con carne spice mix (the 500g-of-mince size)
- 1 tbsp tomato paste
- 500ml Slow Soffritto Tomato Base (#13), defrosted
- 200ml beef stock
- 1 × 400g can kidney beans, drained and rinsed
- 1 tsp cocoa, or 1 square dark chocolate
- Juice of ½ lime, to finish
- Fresh coriander, to serve

**Method**

1. **Brown the mince** — Hot pan, two batches, and leave it alone until it catches and colours. Crowding it steams it grey, which is the main reason chilli comes out tasting of nothing. Set aside.
2. **Capsicum** — Into the fat, 5 minutes. From frozen it will throw water; let that cook off before going on.
3. **Bloom the spices** — Spice mix and tomato paste into the oil for a minute, until fragrant and darkened. Packet mixes taste dusty and raw if they go straight into liquid.
4. **Base and stock** — Mince back in, then the tomato base and the stock. Simmer uncovered 40 minutes, stirring now and then.
5. **Beans** — Last 20 minutes only. An hour of simmering turns them to mush.
6. **Finish** — Cocoa stirred through, then the lime off the heat. Taste before adding any salt — most mixes are already salted.

**To serve**

Rice, with yoghurt or sour cream on the side for anyone who wants it cooler. Grated cheese and coriander on top.

**Batch and freeze**

Cool and freeze in portions, 3 months. Genuinely better on day two — make it ahead if you can. Fridge 4 days.

**Nutrition (approx.)**

Per 100g: ~120 kcal · 7g protein. Per portion (~400g): ~490 kcal · 29g protein.

**Notes**

The base is doing the job of an onion, garlic, a tin of tomatoes and twenty minutes of chopping. Without it, soften a chopped onion and two garlic cloves at step 2 and use a 400g can of tomatoes plus 100ml more stock in place of the 500ml.

Not lean mince. At 5% it goes to gravel over a long simmer; the fat is what keeps it tender and carries the spice.

Cocoa is not for chocolate flavour — it rounds the sauce out and takes the edge off the tomato. A square of dark chocolate does the same.

Packet mixes land mild to medium, so this is usually fine for him as it comes. Serve his before the lime if he objects to sour.

## 16. Fresh Avocado Rice Paper Rolls

## 17. Air Fryer Veggie Rolls

_Carrot, red cabbage, pepper and kurrat, double-wrapped and sprayed. The crunchy, bright one._

Makes 12 · Prep 25 min · Cook 12 min

Tags: Mains, Low calorie, Air fryer

**Ingredients**

- 1 carrot (~80g), finely julienned
- 100g red cabbage, shredded very fine
- 1 bell pepper (~150g), finely diced
- 4 spring onions, or a generous handful of local leeks — كراث (~35g) — sliced finely across the leaves
- 2 garlic cloves, crushed
- 1 tsp grated ginger
- 1 tbsp soy sauce
- ½ tsp white pepper
- 1 tsp cornflour
- 24 rice paper sheets (22cm)
- Light olive oil spray

**Dipping sauce — nuoc cham**

Dissolve 1½ tbsp sugar in 4 tbsp warm water. Stir in 2 tbsp fish sauce, the juice of a lime and 1 minced garlic clove. Sliced red chilli at the end, after pouring his out.

**Method**

1. **Cornflour first** — Toss it through the dry vegetables before anything wet goes near them. It coats the shreds and catches the water they give up in the heat.
2. **Mix** — Garlic, ginger, soy and white pepper through.
3. **Double wrap** — Dip a sheet for 2 seconds, lay it on a damp tea towel, dip a second and lay it straight on top. Two seconds, no more; they finish softening on the towel.
4. **Roll** — 2 tbsp of filling along the lower third, sides in, roll tight without straining.
5. **Rest** — Seam down, not touching, uncovered, 10 minutes. This dries the surface so it blisters instead of sticking.
6. **Air fry** — Spray the basket properly, rolls in a single layer with gaps between them, spray the tops. 190°C for 10–12 minutes, turning at halfway. They puff and blister, which is the texture you are after.

**Nutrition (approx.)**

Per 100g: ~160 kcal · 2.5g protein. Per roll: ~80 kcal.

**Notes**

Two sheets per roll, always. A single layer tears and goes leathery with this little oil.

Light or regular olive oil spray, not extra virgin — it smokes and turns bitter at 190°C.

Rice paper welds itself to metal and to itself. Spray the basket, leave gaps.

Spring onions are the original, but the local leek — كراث, kurrat or Egyptian leek — is if anything better here. It is grown for its leaves rather than a white stem, so it comes finer and sharper than an imported leek and sits very close to spring onion. Slice across the leaf; lengthways it is stringy.

None of the four need pre-cooking, which is the whole reason they were chosen.

## 18. Pan-Fried Veggie Rolls

## 19. Prawn Rice Paper Rolls

_Raw prawn chopped small so it cooks through in the time the wrapper takes to blister. Fish sauce in the filling to echo the nuoc cham._

Makes 6 generous rolls · Prep 20 min · Cook 10 min

Tags: Mains, Low calorie, High protein

**Ingredients**

- 300g raw prawns, thawed weight — buy about 400g frozen — peeled and chopped into 1cm pieces
- 1 carrot (~80g), finely julienned
- 4 spring onions, or a generous handful of local leeks — كراث (~35g) — finely sliced
- 2 garlic cloves, crushed
- 1 tsp grated ginger
- 1 tbsp fish sauce
- ½ tsp white pepper
- 1 tsp cornflour
- 12 rice paper sheets (22cm) — two per roll, they are double-wrapped
- Olive oil spray

**Method**

1. **Thaw and dry** — Thaw overnight in the fridge, or 10 minutes in a colander under cold running water, never warm. Pat dry, spread on kitchen paper and leave 15 minutes, pressing once or twice. They are the main source of water in this filling, and wet prawn steams the roll from the inside.
2. **Mix and chill** — Everything but the wrappers, 15 minutes in the fridge. Cold filling rolls far more tightly.
3. **Double wrap** — Dip a sheet for 2 seconds, lay it on a damp tea towel, dip a second and lay it straight on top.

**Air fryer**

Spray the basket well, rolls in a single layer with gaps, spray the tops. 190°C for 14–16 minutes, turning at halfway. Longer than the vegetable rolls on two counts: these are fatter, and the prawn goes in raw. Cut one open at 14 minutes and check it is opaque all the way through.

Nuoc cham, as for #16.

Chop to about 1cm. Larger pieces are still translucent in the middle by the time the wrapper has gone too dark.

Raw prawns, not pre-cooked ones. Cooked prawn turns rubbery over the eight minutes the wrapper needs.

Frozen is fine, and usually better than what is sitting on the fish counter, which was frozen anyway. Allow about a third extra by weight, because the ice glaze goes down the sink.

Some frozen prawns are treated to hold extra water — they look unusually plump and feel slippery. Those need the full fifteen minutes on kitchen paper, and toss the chopped prawn with the cornflour straight away to bind whatever is left.

Six fat rolls, not twelve thin ones. 300g of prawn spread over twelve works out at about two prawns each, which is not worth the wrapping.

## 20. Protein Kousa Mahshi

_Zucchini stuffed with spiced meat and no rice, simmered in red tomato sauce until tender._

Serves 4 · Prep 30 min · Cook 30–35 min (hob) or ~50 min (oven)

Tags: Mains, Middle Eastern, Low calorie, High protein

**Zucchini and filling**

- 8–10 small pale green zucchini (kousa), about 1kg
- 600 g lean beef or lamb mince (5%)
- 150 g of the scooped zucchini flesh, finely chopped
- 1 egg white
- 1 tsp 7 spices (sabaa baharat)
- ½ tsp cinnamon
- ½ tsp salt, ¼ tsp black pepper
- 1 tbsp tomato paste

**Red sauce**

- 1 tbsp olive oil
- 1 white onion, finely chopped
- 3 garlic cloves, crushed
- 3 tbsp tomato paste
- 400 g can chopped tomatoes
- 750 ml water or stock (600 ml if baking)
- ½ tsp 7 spices, ½ tsp salt
- 1 tsp dried mint, crushed between your fingers

**Method**

1. **Core the zucchini** — Cut off the stem ends and hollow each with a corer or narrow peeler, leaving walls about 5 mm thick and the base intact. Too thin and they split. Keep the flesh.
2. **Mix the filling** — Raw mince, 150 g of the chopped flesh, egg white, spices and tomato paste. Mix with a light hand; working it hard makes it bouncy.
3. **Stuff them full** — Right to the top this time. With no rice there is nothing to swell, so the old three-quarters rule doesn't apply and an under-filled one just collapses.
4. **Start the sauce** — Soften the onion, add garlic, then tomato paste for 2 minutes. Add tomatoes, water, spices and salt, and bring to a simmer.
5. **Cook on the hob** — Nestle the zucchini in, open ends up, just covered. Cover and simmer gently 30–35 minutes until a knife slides in easily. Don't stir; turn the pot occasionally.
6. **Or bake** — Pack them into a deep dish, pour the sauce over so they are two-thirds submerged, cover tightly with foil, and bake at 190°C for 45–50 minutes, uncovering for the last 10–15 to colour. Use 600 ml liquid rather than 750, since a covered dish barely evaporates.
7. **Finish** — Stir the dried mint into the sauce for the last 5 minutes. Rest 10 minutes, then serve with the sauce spooned over and yogurt alongside.

**Nutrition (approx.)**

Per serving (¼): ~312 kcal · 37g protein.

Per 100g: ~62 kcal · 7.4g protein.

Per stuffed zucchini: ~105 kcal · 15g protein, before sauce.

**Notes**

The zucchini flesh and the egg white are not optional. They bind the filling and hold its moisture; meat on its own shrinks into dense little pebbles. The flesh costs about 25 kcal across the whole dish and is already to hand from the coring.

Don't salt the chopped flesh before it goes in. It will weep and loosen the filling.

Lean mince matters more now than it did. With the rice gone, fat is the only thing left that can make this heavy.

Start checking at 30 minutes on the hob. With no rice to swell, it is done sooner than a stuffed zucchini usually is.

For the traditional version: drop the mince to 300 g, add 100 g washed short-grain rice, leave out the egg white and flesh, and stuff only three-quarters full. 35–45 minutes on the hob, and about 330 kcal and 22g protein a serving.

Some families finish with lemon or a spoon of pomegranate molasses.

Rolling together is half the fun with a child — plain cucumber and avocado rolls and a bowl of edamame for him.

## 23. Adana Shish Kebab with Peppers

_The fuller Turkish version, with peppers and garlic chopped into the mince rather than just spices. Written mild so he can eat it._

Serves 4 · Prep 30 min (plus 1 hr chilling) · Cook 12 min

Tags: Mains, Middle Eastern, High protein, Air fryer

**Kebab**

- 500g beef mince, around 20% fat, coarsely minced once — or 60% beef to 40% lamb
- 8 small frying peppers (~100g), finely chopped
- 1 red capsicum (~150g), finely chopped
- 4 garlic cloves, finely chopped
- 1 tbsp sweet paprika
- 2 tsp salt
- Lavash, khubz or tortillas, to serve

**Sumac onions**

- 2 red onions, sliced into half-moons
- A small handful of parsley, chopped
- 1½ tbsp ground sumac
- 2 tbsp olive oil
- A pinch of salt

**Method**

1. **Skewers** — Soak wooden ones in water for an hour, or use flat metal ones. Flat, not round; round skewers let the meat spin.
2. **Chop by hand** — Peppers and garlic very fine, with a knife. A food processor turns them to slurry and the water makes the kebab slide off the skewer. Pat them dry if they look wet.
3. **Knead** — Mince, peppers, garlic, paprika and salt in a bowl, worked hard with your hand for a full 5 minutes until it turns sticky and holds together in one mass. This is the step that makes it cling to the skewer.
4. **Chill** — Covered, 1 hour minimum. Cold mince shapes; warm mince falls apart.
5. **Shape** — Wet hands, take a handful, and press it along the skewer into a long flat strip about 1cm thick.
6. **Cook** — Charcoal is best; see below. Otherwise a very hot griddle pan, 5–6 minutes a side, or the air fryer at 200°C for 12 minutes, turning at halfway.
7. **Onions** — Toss everything together and leave 10 minutes while the kebabs cook.
8. **Serve** — Slide off the skewer onto warm lavash, pile the onions over.

**On the barbecue**

Let the charcoal burn down to grey ash with no flames showing. Adana wants steady heat, not fire.

Rest the skewer ends on the sides of the barbecue so the meat hangs about 10cm above the coals without touching the grate — that is how it is done over a mangal, and it is why the kebab does not stick. If your grill will not allow it, lay them straight onto clean, properly hot bars.

Leave them completely alone for the first 2–3 minutes. The crust has to set before you move them, or the meat tears and drops into the coals. After that, turn every 2 minutes, 8–10 minutes in all.

The fat will drip and flare. Keep one corner with no coals under it to move them to.

No oil on the meat. The fat in the mince is all it needs.

Put whole tomatoes and long green peppers on at the same time; they take about as long. Slide everything onto warm lavash and leave it a minute so the bread takes up the juices.

**Nutrition (approx.)**

Per 100g: ~190 kcal · 10g protein. Per serving (¼, without bread): ~425 kcal · 22g protein. Add ~150 kcal for a lavash.

**Notes**

Four peppers in the original list and only one of them is hot. The red one is sweet, the small green ones are Turkish frying peppers — mild, grown for the pan rather than for burning — and the flakes are pul biber, which is fruity rather than fierce. Only the single red chilli brings real heat, and it is left out here.

To make it properly hot, add 1–2 finely chopped red chillies and swap the paprika for 2 tbsp pul biber. If you only have ordinary chilli flakes, use a third as much plus paprika to make up the colour.

Look for the long pale green frying pepper, often sold simply as "fry chilli". Taste a sliver first, as batches vary and some come through hot.

Not lean mince. At 20% fat it stays juicy and grips the skewer; lean mince dries and drops off.

Minced once and coarse. Twice-minced beef goes pasty and the kebab turns dense.

Adapted from Refika's Adana shish kebab. The original is 250g of mince; this is doubled and made mild.

## 24. Prawn Dumplings

## 25. Pancit Canton

_Filipino stir-fried noodles with chicken and a mountain of vegetables, built around a single pack of noodles._

Serves 4 · Prep 20 min · Cook 20 min

Tags: Mains, Low calorie, High protein

**Ingredients**

- 227 g pancit canton noodles (one pack, dry — do not soak)
- 300 g chicken breast or thigh, sliced thin
- 1 tbsp vegetable oil
- 3 garlic cloves, minced
- 1 small red onion, sliced
- 1 carrot, cut into matchsticks
- ¼ small cabbage (~200 g), shredded
- ½ red bell pepper, sliced
- 125 g pak choy, roughly chopped
- 700 ml chicken stock
- 3 tbsp soy sauce
- 2 tbsp oyster sauce
- ½ tbsp sesame oil
- 2 tsp corn starch mixed with 1 tbsp cold water
- Salt and plenty of black pepper
- Lemon wedges, to serve

**Method**

1. **Sear the chicken** — Heat the oil in your largest pan or wok. Season the chicken with salt and pepper and sear in batches over high heat until just cooked, then put it on a plate. Cooking it separately keeps it from turning grey and tough later.
2. **Aromatics** — Soften the onion 2 minutes, then the garlic for 30 seconds. Add the carrots and stir-fry 2 minutes.
3. **Build the sauce** — Pour in the stock, soy sauce, oyster sauce and sesame oil, and bring to a rolling boil.
4. **Noodles** — Add them straight from the packet, pushing them under the liquid. They soften within a minute, then you can toss them properly. Simmer 5–8 minutes, turning gently with tongs, until they have drunk nearly all the liquid.
5. **Finish** — Fold in the cabbage, bell pepper and pak choy for the last 2 minutes, then return the chicken with its juices. If it looks wet, stir in the corn starch slurry and cook 1 minute; if it goes dry before the noodles are tender, add hot stock a splash at a time.
6. **Serve** — Season generously with pepper, with lemon to squeeze over.

**Nutrition (approx.)**

Per serving (¼, about 360g): ~392 kcal · 26g protein.

Per 100g: ~108 kcal · 7.1g protein.

**Notes**

Never pre-soak canton noodles — they are pre-cooked and will turn to mush.

Use a bigger pan than feels necessary. Even half a kilo of noodle and vegetables is a lot to toss.

Vegetables late and brief, so they stay crisp against the soft noodles.

For a more chicken-forward version, take it to 450 g — about 460 kcal and 34g protein a serving.

Reheats well with a splash of water.

## 26. Souvlaki with Greek-Herb Pita

_Lemon-oregano chicken skewers with soft homemade pita baked with herbs through the dough._

Serves 4 (makes 8 pitas) · Prep 25 min · Rise 1½ hrs · Marinate 2–8 hrs · Cook 12–14 min

Tags: Mains, High protein, Air fryer

**Chicken**

- 700g boneless chicken thigh, in 3cm cubes
- 2 tbsp olive oil
- Juice of 1 lemon, plus the zest
- 3 garlic cloves, crushed
- 1 tbsp dried oregano
- 1 tsp dried thyme
- 1 tsp sweet paprika
- 1 tsp salt, ½ tsp black pepper
- 1 tbsp red wine vinegar

**Greek-herb pita**

- 400g strong white flour, plus extra for dusting
- 7g instant yeast
- 1 tsp sugar
- 1 tsp salt
- 250ml warm water
- 2 tbsp olive oil
- 2 tsp dried oregano, 1 tsp dried thyme, 1 tsp dried rosemary, finely crumbled

**To serve**

- Tzatziki: 300g Greek yogurt, ½ cucumber grated and squeezed dry, 1 garlic clove, 1 tbsp lemon juice, dill
- Tomato, red onion, lettuce, a little feta

**Method**

1. **Marinate** — Mix everything for the chicken and refrigerate 2–8 hours. Overnight is the limit; the lemon starts breaking the meat down past that.
2. **Make the dough** — Whisk the yeast and sugar into the warm water and leave 5 minutes until foamy. Mix the flour, salt, and all the dried herbs, then pour in the yeast water and oil. Knead 8–10 minutes to a smooth, slightly tacky dough. Cover and rise 1 hour, until doubled.
3. **Shape** — Knock back, divide into 8, roll each into a ball, and rest 20 minutes under a cloth. Roll each out to about 18cm and 5mm thick.
4. **Bake the pita** — Oven as hot as it goes, 250°C, with a heavy tray or stone preheating inside. Bake 3–4 minutes until puffed and just blistered. Straight into a clean towel as they come out — trapped steam is what keeps them soft.
5. **Cook the chicken** — Thread onto skewers. Air fryer 200°C for 12–14 minutes, turning halfway. Grill or barbecue 4–5 minutes a side. You want charred edges and 75°C inside.
6. **Serve** — Rest the chicken a few minutes, then build: pita, tzatziki, chicken, salad, a crumble of feta.

**Nutrition (approx.)**

Chicken — per 100g cooked: ~175 kcal · 21g protein.

Pita — per 100g: ~275 kcal · 8g protein. One pita (~85g): ~235 kcal.

Per full souvlaki (one pita, ¼ of the chicken, tzatziki, salad): ~570 kcal · 42g protein.

**Notes**

The herbs go into the dough rather than on top, so they don't scorch at 250°C.

Pita freezes well — cool completely, stack with parchment between, and warm from frozen in a dry pan for a minute a side.

No stone or heavy tray? A preheated upside-down baking sheet works. The heat hitting the base fast is what makes them balloon.

## 28. Tuscan Chicken

_Seared chicken in a garlic cream sauce with sundried tomatoes and spinach, tossed through pasta._

Serves 2 · Prep 10 min · Cook 20 min

Tags: Mains, High protein

**Ingredients**

- 500g chicken breast
- 1 tbsp olive oil
- 120ml heavy cream (½ cup)
- 60ml chicken broth (¼ cup)
- ½ tbsp minced garlic
- ½ tsp Italian seasoning
- 25g parmesan, grated (¼ cup)
- 30g chopped spinach (½ cup)
- 35g sundried tomatoes (¼ cup), sliced
- 100g pasta, any shape
- Salt and black pepper

**Method**

1. **Pasta on** — Salted water, cook to just under al dente, and save a mugful of the water before draining.
2. **Butterfly and sear** — Slice the breasts horizontally into thin cutlets so they cook fast and stay juicy. Season well. Olive oil in a wide pan on medium-high, 3–4 minutes a side to 74°C inside. Lift out and rest.

4. **Deglaze** — Broth in, scraping up everything stuck to the base. That is where the flavour is.
5. **Cream** — Add the cream and Italian seasoning and simmer 2–3 minutes, until it coats a spoon.
6. **Finish the sauce** — Off the heat, stir in the parmesan until smooth, then the spinach just until it wilts. Boiling it after the cheese goes in turns it grainy.

From Soraya's recipe card.

The sauce is generous for 100g of pasta — take the chicken to 1kg and it feeds four off the same amount of sauce.

Sundried tomatoes packed in oil are softer and richer. The dry-packed kind want 10 minutes in hot water first.

## 29. Avgolemono

_The Greek egg-and-lemon chicken soup — orzo and shredded thigh in a broth thickened off the heat with whisked eggs and lemon._

Serves 6 · Prep 20 min · Cook ~1 hr

Tags: Mains, High protein

**Base**

- 5–8 bone-in chicken thighs (~1kg)
- 1 tbsp olive oil
- 1 tbsp Italian seasoning
- 1 whole white onion, diced
- 10 garlic cloves, minced
- 1 cup celery, diced (~120g)
- 1 carrot, diced
- 2 litres chicken broth
- 1 cup orzo pasta (~200g)
- 2 bay leaves
- Salt and black pepper

**Mixture**

- 4 eggs
- 3 lemons, juiced (~150ml)
- Zest of 1 lemon
- A few ladles of the hot broth

**Method**

1. **Brown the chicken** — Season the thighs and brown them skin-side down in the oil, 5–6 minutes, until the skin is properly golden. Lift out.
2. **Soften** — Onion, celery, and carrot into the fat, 6–8 minutes. Then the garlic and Italian seasoning for a minute.
3. **Simmer** — Chicken back in with the broth and bay leaves. Gentle simmer 35–40 minutes, until the meat pulls away from the bone.
4. **Shred** — Lift the chicken out. Discard the skin, bones, and bay leaves, and shred the meat.
5. **Orzo** — Into the simmering broth for 8–9 minutes, until just tender. Taste for salt now, before the lemon goes in.
6. **Temper the mixture** — Whisk the eggs hard until pale and frothy, then whisk in the lemon juice and zest. Add hot broth one ladle at a time, whisking constantly, until you have added three or four. Rushing this is how it curdles.
7. **Off the heat** — Pull the pot off the heat completely, then pour the mixture back in, stirring. It must not boil again or the eggs scramble.
8. **Serve** — Return the shredded chicken, season, and add more lemon to taste. It thickens as it sits.

**Nutrition (approx.)**

Per 100g: ~72 kcal · 4.8g protein.

Per bowl (⅙, ~560g): ~405 kcal · 27g protein.

**Notes**

From Soraya's recipe card.

Never let it boil after the eggs go in. That is the whole technique, and it is why the pot comes off the heat first.

Reheat gently, well below a simmer. It splits if you push it.

The orzo keeps drinking broth as it stands, so leftovers turn almost stew-thick — loosen with extra broth rather than water.

A good one for the plan: 27g protein for ~405 kcal, and one pot covers three meals plus his.

## 30. Arabic Chicken Pasta Salad

_Built in two halves: a base that keeps three days in one container, and the soft things added fresh to each bowl. One session, three lunches._

Makes 3 lunches · Prep 35 min · Cook 15 min

Tags: Mains, Middle Eastern, High protein, Air fryer

**For the container**

- 180g protein pasta, dry
- 2 large carrots (~200g), shredded
- 150g red cabbage, shredded very fine
- ½ red onion, or white, sliced paper thin
- 1 tsp sumac and the juice of ½ lemon, for the onion
- A large handful of parsley and a smaller one of mint, chopped
- 1 tsp olive oil
- Salt

**To add per bowl — buy these too**

- 1 head Boston lettuce, about a third per bowl
- 1 tbsp pumpkin seeds, toasted in a dry pan

**Za'atar yogurt dressing**

- 200g 0% Greek yogurt
- 1 tsp tahini
- ½ tbsp olive oil
- 1 tbsp lemon juice
- 1 tbsp za'atar
- 1 tsp sumac
- 1 small garlic clove, crushed
- ½ tsp salt
- 2–4 tbsp cold water

**Chicken**

- 450g chicken breast
- 3 tbsp 0% Greek yogurt
- 2 tsp 7 spices
- ¼ tsp black lemon powder (loomi)
- 1 garlic clove, crushed
- Olive oil spray
- ½ tsp salt

**Method**

1. **Sumac onion first** — Toss the sliced onion with the sumac and lemon juice and leave it while you do everything else. It softens from raw and sharp into something closer to a pickle.
2. **Marinate the chicken** — Yogurt, 7 spices, loomi, garlic and salt. Flatten any thick ends with a rolling pin so the pieces are an even thickness. Thirty minutes minimum, a few hours better.
3. **Pasta** — Cook a minute under the packet time and rinse under cold water straight away. Drain properly.
4. **Build the base** — Pasta, carrot, cabbage, sumac onion, herbs, olive oil and a little salt into one container. No dressing goes in.
5. **Cook the chicken** — Spray the basket and the chicken with olive oil. Air fryer at 190°C, 12–15 minutes depending on thickness, turning once. Rest 10 minutes before slicing, then chill in its own container.

Per 100g: ~115 kcal · 11g protein. Per bowl: ~640 kcal · 60g protein.

**Notes**

Lettuce and seeds never go in the container. Butterhead collapses within hours of meeting salt or dressing, and the seeds go soft and chewy. Both stay out until the bowl is built.

The dressing stays in its own jar for the same reason. Yogurt pulls water out of shredded carrot and cabbage, and by day two a pre-dressed batch is watery with the dressing sliding off it.

Protein pasta keeps softening for days, so start it firm. A minute under the packet time, then rinsed cold to take the starch off, or it clumps.

One small garlic clove, no more. Raw garlic in yogurt strengthens each day; pleasant on Monday is fierce by Wednesday.

Flatten the breast. The thin end goes dry waiting for the thick end, which is breast's main failing in meal prep. The yogurt marinade is doing the rest of that work.

No pomegranate molasses on purpose, though it is good on chicken elsewhere. Between the loomi, sumac, za'atar and lemon the bowl is already sour from four directions, and the carrot is carrying the sweetness.

If Boston is not in, romaine is the better substitute than iceberg and actually suits the za'atar better; two-thirds of a head, sliced in ribbons. Little gem is the same leaf smaller. Salanova butterhead is the same thing under a brand name.

It is a full meal rather than a light lunch. Dropping the pasta to 120g takes off about 70 kcal a bowl and the chicken to 360g another 60.

## 31. Brothy Red Curry Prawn Noodles

_A thin, fragrant coconut broth rather than a thick curry, ladled over noodles in the bowl. Fifteen minutes once everything is cut._

Serves 2 · Prep 10 min · Cook 15 min

Tags: Mains, High protein

**Ingredients**

- 300g raw king prawns
- 150g silken tofu
- 150g pak choy
- 100g baby asparagus
- 30g Thai red curry paste
- 200g full-fat coconut milk (half a 400ml tin)
- 250ml water
- 2 tbsp fish sauce
- 10g white sugar
- 1 lime
- 15g fresh coriander

**For the bowls — one or the other**

- 100g dried rice noodles
- Or 2 × 200g packs konjac noodles

**Method**

1. **Noodles first** — Rice noodles into a heatproof bowl, covered with boiling water, 4 minutes until softened, then drained and rinsed under cold water. They carry on softening in the hot broth later, so stopping them cold now is the point. Konjac is handled differently — see the notes.
2. **Cut everything** — Baby pak choy quartered lengthways through the root; a full-size head separated into diagonally sliced stems and torn leaves. Woody ends snapped off the asparagus. Silken tofu cubed in the tub and lifted out on the knife rather than tipped about.
3. **Crack the coconut milk** — Half the coconut milk, 100g, into a heavy-bottomed pan over medium heat for 4–5 minutes, until the fat separates out and it smells nutty. Full-fat does this readily where light will not, and it is the step the whole base is built on.
4. **Bloom the paste** — Curry paste into the split fat, 4–5 minutes, stirring regularly, until fragrant. Sugar, another 2 minutes. Stir through half the fish sauce.
5. **Build the broth** — The rest of the coconut milk and the water in. Bring to a simmer.
6. **Everything in** — Asparagus, pak choy stems and prawns for 3 minutes. Slide the tofu in for the last minute and leave it alone, because silken breaks the moment it is stirred. Pak choy leaves go in off the heat, where thirty seconds of residual warmth is plenty.
7. **Season** — Half the lime squeezed in, the remaining fish sauce, then taste. Pastes vary a lot in salt and heat, so this is where it gets fixed rather than earlier.
8. **Build the bowls** — Noodles divided between two bowls, broth ladled over. Lime wedges and a handful of chopped coriander.

**Nutrition (approx.)**

Broth and everything in it, noodles aside — per bowl (½): ~400 kcal · 40g protein. Per 100g: ~65 kcal · 6.6g protein.

Noodles on top, per bowl: 50g dried rice noodles adds ~180 kcal and 3g protein, taking the bowl to ~580. A 200g pack of konjac adds 10–20 kcal and no protein, taking it to ~415.

**Notes**

Rebuilt from a saved app recipe around what is actually in the kitchen: a full-fat tin let down with water in place of light coconut milk, silken tofu, and pak choy and asparagus where the original had button mushrooms and tenderstem broccoli. The figures come off the tins rather than from estimates — 175 kcal per 100ml for the coconut milk, 59 kcal and 8.2g of protein per 100g for the silken tofu.

The noodles are costed separately because they are the one part that changes the bowl completely, and because the choice is made per bowl rather than per pot. Everything above the noodle line is fixed; everything below is yours on the day.

Half a tin, not a whole one. Coconut fat is where nearly all the calories sit, and a whole 400ml tin is 700 kcal, so using half and making the volume up with water keeps the broth generous while the bowl stays near 400. Diluting further does not help — water adds volume, not calories. The whole tin takes a bowl to roughly 575 before noodles, which is worth it only if you want it properly rich.

Silken tofu is a better trade than it looks: 59 kcal per 100g against about 140 for firm, and 8.2g of protein against 16, so it costs less per gram of protein. It will not hold cubes in a simmering broth, which is why it goes in at the last minute and is not stirred. Firm tofu swaps in 1:1 if you want pieces with edges, and can go in two minutes earlier.

Pak choy cutting depends on the size. Baby heads quarter lengthways straight down through the root, with only a thin slice off the base — the root is what holds each quarter together, and cutting too far up leaves loose leaves. A full-size head is really two vegetables: white stems cut away where they meet the green and sliced on a steep diagonal into 2cm pieces, leaves torn into wide ribbons. Wash it properly either way, since grit sits right down where the stems overlap and quartering is what opens that up to the tap. Cut it while the broth is building rather than ahead, because the edges brown.

Baby corn is the original's vegetable and a good one here, especially as the only non-green thing in the bowl. 150g, halved lengthways, in two minutes before the prawns. Tinned is already cooked and wants only a minute, so hold it back and put it in with everything else. Tenderstem swaps straight back in for the asparagus, 1:1 by weight, same three minutes.

Fine asparagus keeps cooking in the hot broth after the pan is off. Ladle up promptly or it turns olive and floppy. Pencil-thick spears can go in thirty seconds early.

Konjac wants handling quite differently from rice noodles. Rinse properly under cold running water for a good minute, because the packing brine smells, then dry-fry in a hot non-stick pan with no oil for 3–4 minutes until they squeak and stop giving off water. That step is what takes the rubberiness out. Do not simmer them in the broth — they absorb nothing and the water they release thins it. Into the bowl, broth over.

Not a thick curry — if it reduces too far it stops being the dish. Loosen with water rather than more coconut milk, which would sweeten it.

Batch cooking: make the broth and nothing else. Steps 3 to 5 scale straight up and triple is comfortable in one large pan, but hold back the lime and half the fish sauce, because the broth concentrates every time it is reheated and the seasoning wants doing at the bowl. Curry paste does not scale quite linearly for heat either; go a little under at the large batch and correct once it is all in.

Each serving is then a ladleful back to a simmer, 400ml or so, with the asparagus, pak choy stems and prawns in for 3 minutes and the tofu for the last one, exactly as written. There is nothing to gain by cooking the prawns into the batch, since reheated prawns go rubbery, and the greens turn olive overnight. Noodles never go near the stored broth — they keep drinking it and collapse. Lime and coriander at the bowl, always.

Four days in the fridge. The broth freezes for 3 months without the noodles, prawns or tofu — freezing turns tofu spongy and honeycombed, and silken in particular does not survive it. Cool fully, freeze in portions, and do not refreeze once thawed. Coconut broth often looks grainy or split after thawing; bring it back gently, well under a boil, and it pulls together again.

Scaled to four, as cooked: 600g prawns, 300g silken tofu, 200g asparagus, 300g pak choy, a whole 400ml tin let down to 600g of liquid, and double the paste, sugar and fish sauce. That lands on the same ~400 kcal and 40g of protein a portion, since the tin and tofu per head work out identical. The 600g of liquid is tighter than the ratio here, though, so it comes out concentrated rather than brothy — another 200–300g of water brings it back and costs nothing.

## 32. Smashed Cucumber and Chilli Chicken Pasta Salad

- 200g pasta — 50g dry a serving, see the notes

- 50g fresh coriander
- 1 × 165g can sweetcorn, drained

**For the dressing**

- 250g full-fat cottage cheese

**Nutrition (approx.)**

Base without pasta: ~390 kcal · 51g protein a serving.

With 50g dried Kaizen protein pasta: ~500 kcal · 68g protein.

With 50g dried normal macaroni: ~568 kcal · 57g protein.

**Notes**

Don't swap the chilli oil for olive oil to save calories — it doesn't. Two tablespoons of olive oil is 239 kcal against 156 for crispy chilli oil, because chilli oil is partly chilli and crispy bits rather than pure fat.

The original uses 4 tbsp in the dressing plus another 4 tsp on top, which comes to 104 kcal a serving. Two tablespoons in total is plenty.

A low-carb protein pasta is worth it here. For roughly the same calories as ordinary pasta it adds about 10g of protein and a great deal more fibre.

Doesn't freeze — raw cucumber goes soggy and the yoghurt dressing splits. Fridge only, and it keeps 2–3 days.

## 36. Middle Eastern Air Fryer Chicken

_A lemon, garlic and baharat rub with no yoghurt in it. A short salt brine first is what keeps the breast juicy._

Serves 4 · 209 kcal a serving

Tags: Mains, Middle Eastern, Low calorie, High protein, Air fryer

**Ingredients**

- 600 g chicken breast, cut into 3 cm chunks
- 1 tbsp salt, for the brine
- 1 tbsp olive oil
- 2 tbsp lemon juice
- 3 garlic cloves, crushed
- 2 tsp baharat or 7 spice
- 1 tsp ground cumin
- 1 tsp ground coriander
- 1 tsp smoked paprika
- ½ tsp turmeric
- ¼ tsp cinnamon
- ½ tsp salt, for the rub
- Black pepper
- Sumac and chopped parsley, to finish

**Method**

1. Dissolve the tablespoon of salt in 500 ml cold water and sit the chicken in it for 15 minutes. No longer, or it goes salty. Drain and pat dry.
2. Mix the oil, lemon juice, garlic, spices, remaining salt and pepper into a loose paste. Add the chicken and turn until every piece is coated.
3. Leave 30 minutes at room temperature, or up to 4 hours in the fridge. Longer than that and the lemon starts to make the texture chalky.
4. Spread the pieces in a single layer in the basket and air fry at 200°C for 12–14 minutes, shaking at 7 minutes, until charred at the edges and 74°C in the middle.
5. Rest for 3 minutes, then scatter with sumac and parsley.

**Nutrition**

Per serving: 209 kcal · 35 g protein · 2 g carbs · 5.6 g fat

Per 100g: 181 kcal · 30 g protein · 1.7 g carbs · 4.8 g fat

**Notes**

- The brine is not optional with breast meat. Without yoghurt there's nothing holding moisture in, and 15 minutes in salted water is the difference between juicy and dry.
- Keep the tablespoon of oil. It's 30 kcal a serving and it's what makes the spice stick and char rather than scorch and fall off. Spray oil alone brings it to about 179 kcal but the crust suffers.
- Don't crowd the basket. Two smaller batches brown properly; one full one steams.
- Whole breasts rather than chunks: 200°C for 16–18 minutes, turning once.
- Thighs come to about 265 kcal a serving, need no brine, and are far more forgiving if you overshoot the time.
- Good cold the next day — through the smashed cucumber pasta salad, or in a wrap with the Greek Yogurt Flatbread.

## 37. Taco Salad with Quest Chips

_Full-fat mince, drained hard, with Quest chips crushed over at the table. The draining is the whole trick._

Serves 4 · Prep 15 min · Cook 10 min

Tags: Mains, Low calorie, High protein

**Ingredients**

- 500 g full-fat beef mince
- 300 g white cabbage, finely shredded
- 1 batch pico de gallo
- 100 g full-fat Greek yogurt
- 40 g cheddar, grated
- 2 × 32 g bags Quest tortilla style protein chips
- 2 tbsp taco seasoning
- Lime wedges, to serve

**Method**

1. Brown the mince hard in a dry pan, leaving it alone between stirs so it colours rather than steams.
2. Drain it properly — tip the pan and spoon the fat off, or turn the lot into a sieve. This is the step that matters: it takes roughly 400 kcal off the batch, about a third.
3. Back into the pan with the seasoning and a splash of water. Two minutes, until it clings to the meat.
4. Cabbage into the bowls, mince over, then the pico, yogurt and cheese.
5. Crush the chips over at the table, not before. They soften within minutes of touching anything wet.

**Nutrition**

Per serving: 380 kcal · 36 g protein · 20 g carbs · 17 g fat

Per 100g: 121 kcal · 11.5 g protein

**Notes**

- Yogurt in place of sour cream. Full-fat Greek is 97 kcal per 100g against 190 for sour cream, and at this thickness you can't tell.
- Cabbage rather than lettuce is deliberate. Dressed cabbage holds three days in a lunchbox; lettuce collapses overnight.
- A Quest bag is 140 kcal and 20 g protein, so the chips carry about a quarter of the protein here. Two more bags takes it to roughly 450 kcal and 46 g protein.
- Shop taco seasoning is mostly salt, with a little sugar. To mix your own: 2 tsp cumin, 2 tsp smoked paprika, 1 tsp chilli powder, 1 tsp oregano, 1 tsp garlic powder, 1 tsp salt.
- 5% mince saves about 55 kcal a serving over full-fat once the full-fat is drained, and gives more protein. Full-fat drained tastes better, so it depends which you care about that day.

## 38. Creamy Cabbage and Chicken Soup

_Cabbage cut long to stand in for pasta, with evaporated milk doing most of the work of cream._

Serves 6 · Prep 20 min · Cook 35 min

Tags: Mains, Low calorie, High protein

**Ingredients**

- 500 g lean chicken mince
- 1 tbsp olive oil
- 1 white onion, chopped
- 4 garlic cloves, crushed
- 2 sweet red peppers, chopped
- 3 tbsp tomato paste
- 400 g can whole peeled plum tomatoes, crushed by hand
- 1.2 litres chicken stock
- 800 g cabbage, cut into long strips about 1 cm wide
- 150 g spinach, or 100 g frozen
- 200 ml evaporated milk
- 100 ml cooking cream
- 2 tsp smoked paprika
- 1 tsp dried oregano
- ½ tsp chilli flakes
- Salt and plenty of black pepper

**Method**

1. **Brown the mince** — Hard, in the oil, leaving it alone between stirs so it colours rather than steams. Lean mince carries no fat, so this browning is the only place the depth comes from. Lift it out onto a plate.
2. **Soften** — Onion and peppers 5 minutes, then the garlic for 30 seconds.
3. **Darken the paste** — Tomato paste in for 2 minutes, stirring, until it turns brick red and smells sweet rather than sharp.
4. **Simmer** — Stock, tomatoes, paprika, oregano and chilli, then the mince back in with its juices. Ten minutes.
5. **Cabbage** — Quarter it, cut the core out, then slice each quarter along its length rather than across, so you get long strips rather than shreds. In it goes, 10 minutes for bite or 15 for silk. Spinach for the last two, or the last five if frozen.
6. **Off the heat** — Pull the pot off the hob, then stir in the evaporated milk and the cream. Taste and season properly before serving.

**Nutrition (approx.)**

Per serving (⅙): ~268 kcal · 24g protein · 23g carbs · 7.5g fat.

Per 100g: ~48 kcal · 4.4g protein.

**Notes**

The dairy goes in off the heat and the pot must not boil again, because evaporated milk splits against tomato acid at a rolling boil. Cooking cream is more stable than fresh cream but will still break if pushed.

Season harder than feels necessary at the end. Without cheese there is no salt or umami coming in at the finish, so a soup that tasted balanced while simmering will read flat once the dairy softens it.

Evaporated milk is about 80 kcal per 100ml against 340 for double cream. Most of the body here comes from it rather than from the cream, which is doing the richness.

Long strips are the point of the dish. Cut that way the cabbage catches on a fork like tagliatelle, where finely shredded cabbage collapses and disappears into the broth.

Cabbage keeps cooking in a hot pot after the heat is off, so pull it a few minutes before it looks right if the soup is not being eaten straight away.

Whole peeled plum tomatoes crushed by hand, not chopped. Chopped cans usually carry calcium chloride, a firming salt that stops the pieces breaking down, which is exactly what they need to do in a broth. A 400ml carton of passata works too and gives a smoother soup with no tomato pieces in it.

Red and white cabbage mixed is fine and red holds its bite longer, but it bleeds. The tomato acid keeps it purple rather than blue, so the soup goes a muddy purple-brown. Keep red to about a third and it reads as flecks instead. Red also softens more slowly, so start it a few minutes ahead of the white.

Frozen spinach suits this better than fresh. Use 100 g rather than 150 g, since frozen is already wilted and far more concentrated, and squeeze the water out before it goes in or it thins the broth.

Lean beef mince works in place of chicken, at about 290 kcal a serving.

Four days in the fridge and better on day two. It freezes for 3 months, though the cabbage softens further on thawing.

## 39. Greek Yogurt Flatbread

_Soft, chewy flatbreads with no yeast and no oil, built on gluten flour so a single one carries 14 g of protein._

Makes 4 · Prep 10 min · Rest 15 min · Cook 15 min

Tags: Breads, High protein

**Ingredients**

- 110 g self-raising flour, plus a little for dusting
- 40 g vital wheat gluten
- ¼ tsp baking powder
- ¼ tsp salt
- 150 g 0% Greek yogurt
- ½ tsp garlic granules or dried herbs (optional)

**Method**

1. Mix the flour, gluten, baking powder, salt and any seasoning, then add the yogurt and bring it together into a soft dough. A little more flour if it is sticky.
2. Knead 5 minutes on a floured surface, until smooth and springy.
3. Cover and rest 15 minutes. Skipping this means the dough shrinks back as fast as you roll it.
4. Divide into 4 balls and roll each into a thin round, 3–4 mm thick.
5. Heat a dry non-stick pan over medium-high heat. Cook each flatbread until puffed with golden spots, about 2 minutes per side.

**Nutrition**

Per flatbread: 163 kcal · 14 g protein · 24 g carbs · 0.7 g fat

Per 100g: 241 kcal · 21 g protein · 36 g carbs · 1 g fat

**Notes**

- The gluten is what gives these their chew and most of their protein. They come out closer to a pita than a soft tortilla, so they are better for wrapping and folding than for tearing into soup.
- The quarter teaspoon of baking powder makes up for the self-raising flour being diluted by the gluten.
- No self-raising flour? Use 110 g plain flour plus 1¼ tsp baking powder in total.
- They puff best in a properly hot dry pan. A lukewarm pan dries them out before the steam inside can lift them.
- Best warm from the pan. They stiffen as they cool, and a few seconds back in a dry pan brings them round.

## 40. Cottage Cheese Flatbread

## 41. Protein Tostada Shells

_Crisp tostada shells built on gluten flour, so the base carries real protein instead of just carbs._

Makes 4 · 74 kcal each

Tags: Breads, Low calorie, High protein, Air fryer

**Ingredients**

- 60 g vital wheat gluten
- 15 g oat flour or plain (all-purpose) flour
- ½ tsp baking powder
- ½ tsp ground cumin
- Pinch of salt
- 70–80 ml warm water

**Method**

1. Mix the dry ingredients, then add the water a little at a time. Stop as soon as it comes together — gluten dough goes from dry to sticky very fast, and a sticky one won't roll thin.
2. Knead for 2 minutes, then cover and rest for 10. The rest is what lets it roll out without springing back.
3. Divide into 4 and roll each very thin between two sheets of parchment.
4. Dry-fry 30 seconds a side in a hot pan to set them.
5. Air fry at 190°C for about 5 minutes, until they snap rather than bend.

**Nutrition**

Per shell: 74 kcal · 12 g protein · 5.5 g carbs · 0.5 g fat

Per 100g: 330 kcal · 53 g protein · 24 g carbs · 2.2 g fat

Nothing is added during cooking, so if you spray oil, count that on top — a light spray is 5–10 kcal.

**Notes**

- Vital wheat gluten is sold as gluten flour or seitan flour, usually in the baking aisle rather than with the specialist flours. A 567 g bag is about 38 shells.
- The 15 g of flour is only there to dilute the gluten. Pure gluten goes rubbery like seitan, and a little low-gluten flour is what lets it snap. Oat and plain flour both work; plain gives a slightly crisper shell, oat a faintly nubbly one with more fibre.
- No gluten flour? Chickpea flour (besan) makes a thin batter crepe that crisps the same way, at about 75 kcal and 4 g protein a shell. Not low carb, but always available here.
- For 8 shells: 120 g gluten, 30 g flour, 1 tsp each baking powder and cumin, ½ tsp salt, 140–160 ml water.
- Raw dough keeps 2–3 days wrapped in the fridge, or freezes as flat discs between parchment for a couple of months. Cooked but still soft, 4–5 days in the fridge.
- Crisped shells keep 4–5 days airtight at room temperature, not in the fridge, because fridge humidity turns them leathery. Let them cool completely before the lid goes on or they steam themselves soft. Two minutes at 180°C revives them.
- A shop-bought fried tostada is 130–150 kcal with about 2 g protein.

## 42. Protein Loaf

_Mostly vital wheat gluten, so it's chewy and dense rather than fluffy, and far better toasted than fresh._

Makes 12 slices · Prep 20 min · Rise 1½ hrs · Bake 35–40 min

Tags: Breads, Low calorie, High protein

**Ingredients**

- 200 g vital wheat gluten
- 60 g oat flour or plain flour
- 30 g ground flaxseed
- 7 g instant yeast (1 sachet)
- 1 tsp salt
- 1 tsp sugar
- 1 tbsp olive oil
- 300 ml warm water

**Method**

1. Mix the gluten, flour, flaxseed, yeast, salt and sugar in a bowl.
2. Add the warm water and oil and bring it together into a stiff dough.
3. Knead hard for 8–10 minutes, or 5 minutes in a mixer with a dough hook. This is the one dough where you want maximum gluten development — the opposite of the banana bread.
4. Cover and rise 1 hour somewhere warm. Expect about half the rise you would get from a normal loaf.
5. Shape and drop into a lined 2 lb loaf tin. Rise another 30–40 minutes.
6. Bake at 180°C for 35–40 minutes, until it sounds hollow underneath and reads 95°C inside.
7. Cool completely on a rack before slicing. Cutting it warm drags the crumb.

**Nutrition**

Per slice: 112 kcal · 14 g protein · 7.5 g carbs · 2.8 g fat

Per 100g: 250 kcal · 31 g protein · 17 g carbs · 6 g fat

**Notes**

- The crumb is chewy and dense, closer to a bagel than a soft white loaf. That is inherent to a dough that is mostly gluten, not a fault in the method.
- Noticeably better toasted than fresh.
- The sugar is there to feed the yeast and is gone by the time it bakes, so it doesn't count against you.
- Slice the whole loaf once cool and freeze it with paper between the slices. It toasts straight from frozen.
- A 567 g bag of vital wheat gluten is just under three loaves.
- Keeps 3 days wrapped at room temperature. Don't refrigerate it — bread stales faster in the fridge than on the counter.

## 43. Protein Bagels

_Gluten flour doing the structural work, so they chew like a bagel instead of baking into soft rolls._

Makes 5 · Prep 25 min · Rest 15 min · Cook 25 min

Tags: Breads, High protein

**Ingredients**

- 180 g plain flour
- 70 g vital wheat gluten
- 12 g baking powder
- 1 tsp salt
- 450 g 0% Greek yogurt
- 1 egg yolk, mixed with a splash of water
- 1 tbsp honey, for the boiling water
- Everything bagel seasoning, or sesame and za'atar

**Method**

1. Mix the flour, gluten, baking powder and salt, then add the yogurt and bring it together into a stiff dough.
2. Knead 6–8 minutes, until smooth and elastic. Cover and rest 15 minutes, or it fights you when you shape.
3. Divide into 5. Roll each into a rope and join the ends, or shape a ball and poke through the middle. Make the hole far bigger than looks right — gluten dough springs back and closes it in the oven.
4. Bring a wide pan of water to a gentle simmer with the honey stirred in. Boil the bagels 30 seconds a side, two or three at a time, and lift out onto a rack.
5. Brush with the egg yolk wash and scatter the seasoning over.
6. Bake at 200°C for 20–25 minutes, until deep gold.
7. Turn the oven off and leave them inside with the door ajar for 10 minutes to dry out.

**Nutrition (approx.)**

Per bagel: ~256 kcal · 24 g protein · 33 g carbs · 1.9 g fat.

Per 100g: ~200 kcal · 19 g protein.

**Notes**

The 30-second boil is what separates a bagel from a bread roll. It gelatinises the starch on the surface, which is where the shine and the chew come from. Skipping it gives a perfectly good roll with a hole in it.

Keep the baking powder at 12 g. Yogurt-dough recipes often call for 20 g or more to force a rise without yeast, but at that ratio it leaves a soapy, metallic aftertaste, and here the gluten is carrying the structure anyway.

Don't skip the rest. Kneaded gluten dough is elastic and will shrink back into a ball the moment you stop working it.

Best on the day. Slice and freeze the rest once cool — they toast straight from frozen.

## 44. Red Cabbage with Vinegar

_Three ingredients and a pan. The vinegar isn't optional — without acid the cabbage turns blue-grey instead of staying purple._

Makes 2 portions · 50 kcal a portion

Tags: Snacks, Low calorie

**Ingredients**

- 300 g red cabbage, core out, shredded thin
- 1½ tbsp red wine or apple cider vinegar
- ¼ tsp salt
- 3 tbsp water

**Method**

1. All four into the smallest pan it fits in. Spread thin across a wide pan it dries out before it softens.
2. Lid on, lowest heat, 20–30 minutes, stirring once or twice. Twenty-five minutes leaves some bite; forty-five takes it properly soft.
3. Adjust the salt and vinegar at the end, not the start.

Per portion (~140 g): 50 kcal · 2 g protein · 11 g carbs · 0.2 g fat

Per 100g: 35 kcal · 1.4 g protein · 7.4 g carbs · 0.1 g fat

**Notes**

- Red cabbage is a pH indicator. Acid holds it purple, alkaline tap water turns it blue-grey. That is the whole reason the vinegar goes in at the start rather than being stirred through at the end.
- Stainless or non-stick, never cast iron or aluminium. Both react and dull the colour.
- No sugar and no apple on purpose. Sweet-sour braised cabbage is the German version; this stays sharp, which sits better beside plain chicken and rice.
- Best cold, straight from the fridge, which is where a batch earns itself. Keeps a week and is better on day two. Freezes 3 months.

## 48. High-Protein Berry Waffles

_Cottage cheese and Greek yogurt waffles with vanilla protein, flaxseed, and jammy pockets of blueberries._

Makes 1 deep waffle, cut into 4 quarters · Prep 15 min · Cook 5–7 min

Tags: Snacks, Breakfast, High protein

- 50g frozen blueberries

**Method**

1. **Grind the oats** — In the dry food processor bowl, to a rough flour, about 30 seconds. Tip out.
2. **Blend the wet base** — Cottage cheese, yogurt, eggs, 30–60 seconds, scraping down once, until completely smooth.
3. **Combine** — Add ground oats, protein powder, flaxseed, baking powder, salt. Pulse just until combined. Rest 10 minutes so it thickens; thick but pourable.
4. **Fold in the berries** — Toss the frozen blueberries with a teaspoon of protein powder and fold in by hand, straight from frozen. Pulsing them streaks the batter purple.
5. **Cook** — The whole batch into the deep waffle iron at ~180°C, 5–7 minutes until deep golden and set. Don't open the iron early. Cut into 4 quarters.

**Batch and freeze**

Doubles or triples easily — cook the whole lot, as the batter doesn't keep. Cool completely on a rack so the quarters don't steam soggy, freeze flat, then bag. 2–3 months; reheat from frozen in a toaster or air fryer at 180°C for 3–4 minutes, crisper than day one. Fridge 3 days.

**Nutrition (approx.)**

Per 100g: ~155 kcal · 16g protein.

Per quarter: ~175 kcal · 18g protein — or ~155 kcal using 1 egg + 2 whites. Whole waffle: ~695 kcal · 74g protein.

**Notes**

Bob's Red Mill 8 Grain Hot Cereal swaps 1:1 with nearly identical nutrition — it's cracked grain, so grind it well and give the batter its full rest.

Steel-cut oats work the same way; whole oat groats are too hard for this batter.

## 50. Garlic Bread from a Day-Old Baguette

_Stale-ish bread is the point — dry crumb drinks the butter instead of going squashy. Accordion cuts so it pulls apart at the table._

Serves 6 · Prep 10 min · Cook 15 min

Tags: Snacks

**Ingredients**

- 1 day-old baguette (~250g)
- 100g butter, softened
- 3–4 garlic cloves, crushed — or 4 frozen garlic cubes
- 2 tbsp flat-leaf parsley, finely chopped
- ½ tsp salt
- 2 tbsp grated parmesan, optional

**Method**

1. **Garlic butter** — Beat the crushed garlic, parsley and salt into the soft butter. With frozen cubes, melt the butter in a small pan instead and cook the cubes in it for a minute until they stop sizzling, then let it cool to brushable.
2. **Cut** — Angled cuts every 2cm down the length, stopping before the base crust so the loaf stays in one piece.
3. **Fill** — Push or brush the butter into every slit, right down. Parmesan over the top if using.
4. **Bake** — Wrapped in foil, 190°C for 12 minutes, then open the foil for a final 3–4 minutes to crisp the crust.

**Nutrition (approx.)**

Per 100g: ~395 kcal · 7g protein. Per serving (~60g): ~235 kcal.

**Notes**

One clove per 25–30g butter is the ratio. Three is comfortable, four is properly garlicky, five turns harsh and raw-tasting.

Frozen garlic carries water, which splits soft butter and makes it greasy. Cooking it in melted butter first fixes that, and it is the only reason to change the method.

Fresh bread makes worse garlic bread than day-old. If the baguette has gone properly hard rather than just dry, it wants soaking instead — pappa al pomodoro, or torn into #13.

Assembled unbaked, it freezes in foil for a month. Straight from frozen at 190°C, 20 minutes wrapped, 5 open.
