## 51. Kids' Granola Bars

_Oats, honey and chocolate, pressed hard and baked. The egg is what makes them bars rather than loose granola._

Makes 12 · Prep 15 min · Cook 25 min (plus 2½ hr cooling)

Tags: Snacks

**Ingredients**

- 250g rolled oats
- 70g cashews, chopped small
- 15g black chia seeds
- ½ tsp salt
- 120g honey
- 40g butter
- 1 egg, beaten
- 60g chocolate chips

**Method**

1. **Toast** — Oats and cashews spread on a tray, 160°C for 10–12 minutes, until they smell nutty. Into a large bowl with the chia and salt.
2. **Syrup** — Honey and butter simmered together 2–3 minutes, until it bubbles steadily and thickens slightly. Poured over the dry and mixed fast.
3. **Cool, then egg** — Five minutes off the heat before the beaten egg goes in. Any hotter and it scrambles.
4. **Chocolate** — Half the chips stirred through.
5. **Press** — Into a lined 20cm tin, pressed much harder than feels reasonable with the base of a measuring cup. The rest of the chips scattered over and pressed in.
6. **Bake** — 25 minutes at 160°C.
7. **Cool completely** — Two hours at room temperature, then thirty minutes in the fridge, then cut in single firm downward pushes.

**Nutrition (approx.)**

Per bar (1/12): ~202 kcal · 4.8g protein. Cut into 16 instead and they are ~152 kcal each.

**Notes**

The press is the whole recipe. Almost every batch that crumbles failed at that step rather than in the ingredients, and it is very hard to overdo.

Cutting them warm gives rubble. They need to be properly cold.

The egg is the upgrade over a honey-only bar — it sets in the oven and holds everything together, which is why the honey and butter can come down to 120g and 40g. Leave the egg out and they want more of both.

Chia earns its place by absorbing the syrup as it cools. It is doing structural work, not decoration.

Stir the chocolate into a hot mix and it smears brown through everything. If the kitchen is warm, freeze the chips for ten minutes first.

A muffin tray works and saves the cutting: paper cases, pressed down with the back of a teaspoon, 18–20 minutes. Let them cool completely in the tray before lifting any out. Pressing the mix up the sides gives a cup that holds a spoon of yogurt.

Five days in an airtight tin, 3 months frozen, wrapped individually. They thaw in a lunchbox by break time. Cool them completely before any lid goes on or trapped steam makes them soggy.

## 52. Cranberry Walnut Breakfast Bars

## 59. Air Fryer Sweet Potato, Cubes or Fries

- 2 tsp cornflour
- A few sprays of oil
- 1 tsp smoked paprika
- ½ tsp garlic granules
- ½ tsp salt
- Black pepper

**Method**

1. Cut into 2 cm cubes, or 1 cm batons for fries. Keep them even — mixed sizes means some burnt and some raw.
2. Soak in cold water for 20–30 minutes to wash off the surface starch, then drain and dry them thoroughly in a towel. Any water left on them steams instead of crisping.
3. Toss with the cornflour until lightly dusted, then with the oil, paprika, garlic and salt.
4. Air fry at 190°C in a single layer. Cubes take 15–18 minutes with two shakes; fries take 16–20 and want checking from 14.
5. Salt again straight out of the basket, while they're still hot enough for it to stick.

**Notes**

- The cornflour is 2 kcal a serving and does more for the crust than anything else here.
- Skin on. It crisps well, holds the batons together and saves peeling.
- A tablespoon of olive oil instead of the spray takes it to about 164 kcal a serving. Better colour, still under 200.
- Cubes are the more forgiving cut. Fries are thinner, so the window between crisp and leathery is short.
- They soften within about 10 minutes of coming out. There is no fix for this — eat them straight away.

## 60. Pico de Gallo

1. For the base, stir the onion, jalapeño, lime and salt together and pack it into a jar with the onion submerged. It keeps a week in the fridge and is better from day two, once the acid has taken the raw bite out of the onion.

## 65. Japanese Banana Chiffon Cake

_No butter, barely any flour — the lift comes almost entirely from a meringue folded through a banana batter._

17cm chiffon tin (serves 6) · Prep 20 min · Bake 40 min

Tags: Desserts

**Ingredients**

- 150g very ripe banana, peeled
- 40ml milk
- 4 large eggs, separated
- 60g sugar, divided into 40g and 20g
- 50ml vegetable oil
- 70g plain flour
- ½ tsp baking powder
- Optional: ½–1 tsp vanilla extract, into the yolk batter

**Method**

1. **Banana juice** — Blend the banana with the milk until completely smooth.
2. **Yolk batter** — Whisk the yolks with the 20g of sugar until pale, then the oil and banana mixture. Sift in the flour and baking powder and mix smooth.
3. **Meringue** — Whip the whites, adding the 40g of sugar gradually, to soft peaks. Drop to low and keep going briefly until smooth and fine-textured rather than bubbly.
4. **Fold** — One ladleful of meringue into the yolk batter to loosen, then pour that back into the meringue and fold gently until just combined.
5. **Bake** — Pour in from about 10cm up, shake gently to release air pockets. 170°C for 20 minutes, then 160°C for a further 20.
6. **Cool upside down** — Invert immediately over a bottle and leave until completely cold — at least 1½ to 2 hours — then release with a knife.

**Nutrition (approx.)**

Per 100g: ~265 kcal · 6.5g protein.

Per slice (⅙): ~225 kcal · 5.5g protein.

**Notes**

A chiffon tin is a tall, straight-sided aluminium tin with a hollow tube up the middle. The tube is what you hang it on to cool, and it helps the centre cook through.

Three things make or break a chiffon: never grease the tin (the batter must grip the sides to climb), aluminium rather than nonstick, and always cool upside down or it collapses under its own weight.

No chiffon tin? A loose-bottom round tin works. Cool it by resting the inverted tin's rim on three or four mugs so the cake hangs clear, keep a hand on the loose base as you turn it, and add 5–10 minutes to the second bake.

Doubling: an 8-egg batch needs a 21–23cm tin, filled no more than two-thirds. Keep 170°C for 20 minutes, then 30–35 at 160°C. Fold the meringue in three additions.

Riper bananas are better — brown-speckled ones give sweetness and flavour.

## 66. Pineapple Upside-Down Cake

_Tinned pineapple caramelised in butter and brown sugar under a soft sponge, turned out golden side up._

Two 16cm round tins (makes 2 cakes, serves 8) · Prep 20 min · Bake 25–30 min

Tags: Desserts

**Method**

1. **Prepare the tins** — Oven to 180°C. Line the base of each 16cm tin with baking paper and grease the sides. Loose base? Wrap the outside in foil — the caramel seeps.
2. **Caramel base** — Melt the 40g butter, stir in the brown sugar, divide between the tins, about 2 tbsp each. Pat the pineapple completely dry and lay 3 or 4 slices in each, cherries in the holes if using.
3. **Sponge** — Beat the softened butter and caster sugar pale and fluffy, 3–4 minutes. Eggs one at a time, beating well. Fold in flour and salt, then vanilla and the reserved syrup.
4. **Bake** — Divide between the tins, levelling gently so the slices don't shift. Both on the same shelf, 25–30 minutes, until risen, golden, and a skewer comes out clean. Start checking at 25.
5. **Turn out** — Rest 5 minutes only, then knife round the edge and invert while hot. Wait longer and the caramel sets and glues them in. Leave the tin over each for a minute so the caramel drips down.

**Nutrition (approx.)**

Per 100g: ~330 kcal · 4g protein.

Per cake: ~1,560 kcal, cut into 4 slices of ~390 kcal each. A proper occasion cake — butter and sugar are the structure.

**Notes**

Drying the pineapple matters most. Wet slices water down the caramel and leave a soggy layer.

Turn out hot. This is the step people get wrong.

The reserved syrup in the batter is what makes it taste of pineapple throughout rather than only on top.

One 20cm tin instead: same quantities, bake 35–40 minutes. Two 16cm tins hold slightly more between them, so the cakes are shallower, with more caramel per mouthful.

For deeper cakes in the two tins, scale up by a quarter: 190g butter, 190g caster sugar, 4 eggs, 190g self-raising flour, 4 tbsp syrup — and bake 32–35 minutes. Fill no more than two-thirds of a 5cm tin.

Best on the day, slightly warm, with yogurt or cream. Keeps 2 days covered. One to eat, one to freeze — wrapped whole it keeps a month.

## 67. Bahraini Crème Caramel

_The Gulf version — gaimar, Dream Whip, and cream cheese blended into the custard for a rich, firm set, with the caramel sauce left out._

Serves 12 · Prep 10 min · Cook 5 min · Chill 4 hrs

Tags: Desserts, Bahraini

**Ingredients**

- 1 can gaimar (~170g)
- 1 sachet Dream Whip
- 100g cream cheese
- 500ml milk
- 2 crème caramel sachets — powder only, caramel sauce left out

**Method**

1. **Blend** — Gaimar, Dream Whip, cream cheese, and milk until completely smooth, about a minute. The cream cheese must break up fully or it leaves white flecks.
2. **Add the powder** — Blend briefly again, just to combine.
3. **Cook** — Into a saucepan over medium heat, whisking constantly and scraping the base, until it comes to a full boil and visibly thickens — 3–5 minutes. Boil a few seconds, then straight off the heat.
4. **Set** — Into 12 small cups (about 80g each) or one large mould. Cool at room temperature until the steam stops, then cover and chill at least 4 hours, ideally overnight.
5. **Turn out** — Dip the mould briefly in hot water and invert onto a plate.

**Nutrition (approx.)**

Per 100g: ~185 kcal · 3g protein.

Per portion (1/12, ~80g): ~150 kcal · 2.5g protein. Whole batch: ~1,800 kcal.

**Notes**

Two sachets to 500ml of milk — rather than the 500ml per sachet on the packet — gives the firm, sliceable set that turns out cleanly.

Without the caramel sauce it comes out pale ivory, tasting of cream and vanilla rather than burnt sugar.

Keep whisking the whole time it heats: the starch catches the moment you stop.

## 68. Blueberry and Raspberry Sour Cream Cake

_A rich, dense butter cake shot through with pink and purple berries — moist for days thanks to the sour cream._

20cm square tin (serves 12) · Prep 20 min · Bake 55–65 min

Tags: Desserts

**Ingredients**

- 400g white sugar (2 cups)
- 227g butter (1 cup), softened
- 2 large eggs
- 240g sour cream (1 cup)
- 1 tsp vanilla extract
- 203g plain flour (1⅝ cups)
- 1 tsp baking powder
- ¼ tsp salt
- 150g blueberries (1 cup), fresh or frozen
- 125g raspberries (1 cup), fresh or frozen

**Method**

1. **Prepare** — Oven to 180°C. Line the base of the tin and grease the sides.
2. **Cream** — Beat the butter and sugar 4–5 minutes until pale and fluffy. With this much sugar it looks sandy and unpromising for the first couple of minutes; keep going until it lightens.
3. **Eggs** — One at a time, beating well after each.
4. **Sour cream** — Beat in the sour cream and vanilla until smooth.
5. **Dry** — Whisk the flour, baking powder, and salt together, holding back 1 tbsp. Fold in just until no streaks remain — stop there, or the crumb toughens.
6. **Berries** — Toss both lots of berries with the reserved tablespoon of flour. Fold the blueberries in first, then the raspberries with two or three strokes only — they are far more fragile and will streak the batter pink if you keep going. Straight from frozen if frozen.
7. **Bake** — 55–65 minutes, until golden and a skewer comes out clean. The extra fruit adds water, so it needs longer than it looks. Tent with foil if the top colours before the middle sets.
8. **Cool** — 20 minutes in the tin, then onto a rack.

**Nutrition (approx.)**

Per 100g: ~355 kcal · 3.2g protein · 18g fat · 45g carbs.

Per slice (1/12, ~110g): ~395 kcal · 3.6g protein.

**Notes**

Sour cream is what makes it — the acid tenderises the crumb and keeps it moist for days. Full-fat Greek yogurt substitutes 1:1, slightly drier.

Don't thaw either berry first; they collapse and bleed through the batter.

Frozen raspberries actually hold up better than fresh here — fresh ones are so soft they break apart as you fold.

275g of fruit in a batter this size is a lot, so the crumb around the berries stays damp and the cake is more fragile to slice. Let it cool completely if you want clean squares.

Twice as much sugar as flour is what gives it the dense, moist, almost fudgy crumb rather than a light sponge.

Keeps 3 days covered, freezes 2 months whole or in slices.

An occasion cake — at ~395 a slice it doesn't fit a 1,200 day, and isn't trying to.

## 69. Raspberry Yogurt Bake

_A custardy baked yogurt pot studded with raspberries._

Serves 1 · 140 kcal a pot

Tags: Desserts, Low calorie, High protein

**Ingredients**

- 150 g 0% Greek yogurt
- 1 egg white
- 1 tsp cornflour
- Stevia to taste
- A few drops of vanilla extract
- 50 g raspberries (fresh or frozen)

**Method**

1. Heat the oven to 180°C.
2. Whisk the yogurt, egg white, cornflour, stevia and vanilla until smooth.
3. Pour into a small ramekin and press the raspberries into the top.
4. Bake until set at the edges with a slight wobble in the middle, 20–25 minutes.
5. Eat warm, or chill for a cheesecake-like texture.

**Nutrition**

Per pot: 140 kcal · 19 g protein · 15 g carbs · 0.7 g fat

Per 100g: 65 kcal · 9 g protein · 7 g carbs · 0.3 g fat

**Notes**

- A whole egg instead of the white gives a richer custard and adds about 55 kcal and 5 g fat.
- Strawberries work in place of raspberries.

## 70. Chocolate Protein Mug Cake

_A 90-second chocolate cake with a peanut butter drizzle._

Serves 1 · 225 kcal a mug

Tags: Desserts, High protein

**Ingredients**

- 1 scoop vanilla protein powder (about 30 g)
- 1 tbsp unsweetened cocoa powder
- ½ tsp baking powder
- Stevia to taste
- 1 egg white
- 60 ml skimmed milk
- 10 g peanut butter, thinned with 1 tsp warm water, for drizzling

**Method**

1. Mix the protein powder, cocoa, baking powder and stevia in a large mug.
2. Whisk in the egg white and milk until smooth, with no dry lumps.
3. Microwave for 60 seconds, then in 15-second bursts until just set on top, about 90 seconds in total.
4. Drizzle with the thinned peanut butter.

**Nutrition**

Per mug: 225 kcal · 32 g protein · 9 g carbs · 7 g fat

Per 100g: 180 kcal · 26 g protein · 7 g carbs · 5.6 g fat

**Notes**

- Don't overcook it, because protein mug cakes turn rubbery quickly. Slightly underdone is best.
- Without the peanut butter drizzle, it's about 165 kcal, 30 g protein and 2 g fat.

## 71. Baked Protein Cheesecake with Strawberry Topping

_A creamy crustless cheesecake lightened with Greek yogurt and protein powder._

Serves 8 · 145 kcal a slice

Tags: Desserts, Low calorie, High protein

**For the filling**

- 280 g light cream cheese, at room temperature
- 400 g 0% Greek yogurt
- 2 large eggs
- 2 scoops vanilla protein powder (about 60 g)
- 2 tbsp cornflour
- Stevia to taste (about the sweetness of 80 g sugar)
- 1 tsp vanilla extract
- Zest of ½ lemon (optional)

**For the topping**

- 200 g frozen strawberries
- Stevia to taste

**Method**

1. Heat the oven to 160°C. Line a 20 cm round dish or tin with baking paper.
2. Beat the cream cheese until smooth. Add the yogurt, eggs, protein powder, cornflour, stevia, vanilla and lemon zest, and mix until just smooth. Don't overbeat, because extra air makes it crack.
3. Pour into the dish and bake for 40–45 minutes, until the edges are set and the centre still wobbles slightly.
4. Turn off the oven and leave the cheesecake inside with the door ajar for 30 minutes.
5. Cool, then chill for at least 4 hours or overnight.
6. For the topping, simmer the strawberries with stevia for 8–10 minutes, mashing lightly, until jammy. Cool, then spoon over the cheesecake before serving.

**Nutrition**

Per slice: 145 kcal · 15 g protein · 8 g carbs · 5.6 g fat

Per 100g: 118 kcal · 12 g protein · 6.5 g carbs · 4.6 g fat

**Notes**

- Protein powder firms up quickly, so take it out while the centre still wobbles. It sets fully in the fridge.
- Baking in a tray of hot water (a water bath) gives the smoothest, crack-free top.

## 72. Crustless Pumpkin Pie

_All the filling and none of the pastry, which is where a pumpkin pie's calories actually live._

Serves 8 · 94 kcal a slice

Tags: Desserts, Low calorie, High protein

**Ingredients**

- 425 g pumpkin purée (one tin — purée, not pie filling, which is pre-sweetened)
- 3 eggs
- 2 egg whites
- 200 g evaporated skimmed milk
- 100 g 0% Greek yogurt
- 30 g vanilla protein powder
- Stevia to taste (about the sweetness of 120 g sugar)
- 2 tsp cinnamon
- 1 tsp ground ginger
- ½ tsp nutmeg
- ¼ tsp ground cloves
- ½ tsp salt

**Method**

1. Heat the oven to 175°C and grease a 23 cm dish.
2. Whisk the pumpkin, evaporated milk, yogurt, protein powder, stevia, spices and salt until smooth. The powder goes into the cold liquid first, or it clumps.
3. Taste now and adjust the sweetness. Once the eggs are in you can't taste it safely.
4. Whisk in the eggs and egg whites for 20–30 seconds, just until no streaks remain. Beating air in leaves a foamy, pitted surface.
5. Pour into the dish and bake for 42–55 minutes.
6. Take it out when the outer two-thirds is set and the middle still wobbles. A crack across the top means it has gone too far and will weep.
7. Chill at least 4 hours, ideally overnight. It firms up a lot as it cools, and it is meant to be eaten cold.

**Nutrition**

Per slice: 94 kcal · 10.3 g protein · 8 g carbs · 2.3 g fat

Per 100g: 81 kcal · 8.8 g protein · 6.9 g carbs · 1.9 g fat

**Notes**

- Without sugar's bulk the custard sets a little faster than a conventional one, so start checking at 42 minutes rather than 45.
- Keep the protein powder to 30 g. More than that and a baked custard turns rubbery. Collagen peptides behave better than whey here if you have them, and leaving it out altogether gives about 78 kcal and 7 g protein a slice.
- Vanilla protein powder is already sweetened and already flavoured, so skip any vanilla extract and start at two-thirds of the stevia.
- Stevia works but turns bitter in quantity. The cinnamon, ginger and nutmeg mask it better than almost anything else would, and a pinch more salt knocks back any bitterness that does come through.
- If your evaporated milk tin is smaller, top the difference up with ordinary milk or more yogurt.
- Keeps 4 days in the fridge. It freezes, but a sugar-free custard weeps on thawing, so portion it first and pour off any water.
- Doubling it into one deeper dish does not work — the edges overcook before the centre sets. Bake two dishes, or use a paper-cased muffin tray for 12 portions at 20–25 minutes.

## 73. Protein Marshmallow Slice

_A gelatine-set marshmallow base under a cocoa glaze, with no sugar and no baking._

Serves 4 · 69 kcal a portion

Tags: Desserts, Low calorie, High protein

**For the base**

- 5 egg whites, pasteurised (from a carton)
- 15 g beef gelatine
- 70 ml water
- Sweetener to taste (about the sweetness of 25 g sugar)

**For the glaze**

- 100 ml full-fat milk, heated
- 3 tbsp cocoa powder
- Sweetener to taste (about the sweetness of 8 g sugar)
- 1 tbsp vanilla protein powder
- Coconut flakes, to finish

**Method**

1. Sprinkle the gelatine over the water — not the other way round, or it clumps — and leave 10 minutes. Melt it gently without letting it boil, because boiling destroys its setting power.
2. Beat the egg whites with the sweetener to a firm foam.
3. Pour the cooled but still liquid gelatine in gradually, mixing as you go. Work fast, because it starts setting the moment it cools.
4. Scrape into a lined 15 cm square tin and level the top.
5. For the glaze, whisk the hot milk with the cocoa, sweetener and protein powder. Let it cool a few minutes, then pour over the base.
6. Scatter the coconut flakes and chill 1½ hours.

**Nutrition**

Per portion: 69 kcal · 11.2 g protein · 3.9 g carbs · 1.7 g fat

Per 100g: 74 kcal · 12 g protein · 4.2 g carbs · 1.8 g fat

The coconut flakes are not included in these figures. They are around 700 kcal per 100g, so a light scattering adds roughly 9 kcal a portion and a handful adds a great deal more.

**Notes**

- A 15 cm square tin gives a slice about 4 cm deep. A 1 lb loaf tin works too, just taller and narrower.
- Pasteurised carton egg whites are the safe choice, because nothing here cooks them and the gelatine sets them without heat.
- Using fresh eggs instead: whisk the whites and sweetener in a bowl over barely simmering water until they reach 71°C, keeping the whisk moving, then take them off and whip to firm peaks before folding the gelatine in. That pasteurises them and the texture comes out the same. Without that step, don't serve it to children.
- You cannot bake it to cook the eggs. Gelatine melts at about 35°C, so any oven heat undoes the set.
- Gelatine too hot cooks the whites into threads; too cool and it sets before it is mixed in. Barely warm is the target. If lumps won't dissolve, warm it gently and sieve it before it goes near the whites.
- Chocolate protein powder works in place of vanilla, in which case drop the cocoa back to 2½ tbsp.
- Full-fat milk adds about 7 kcal a portion over skimmed and makes a noticeably better glaze.
- The sweetener does no structural work here — the gelatine does all of it — so any sweetener works and you can pick purely on taste.
- Translated and adapted from a Romanian recipe. The original claims about 50 kcal a portion, which holds for the base alone.

## 74. Blueberry Protein Ninja Creami Ice Cream

_A light, creamy blueberry ice cream with added protein._

Makes 1 pint · 255 kcal a pint

Tags: Desserts, High protein

**Ingredients**

- 50 g frozen blueberries
- Stevia to taste (be generous)
- 300 ml skimmed milk
- 1 scoop vanilla protein powder (about 30 g)
- ¼ tsp guar gum
- 30 ml unsweetened almond milk, for the re-spin

**Method**

1. Microwave the blueberries until thawed and juicy, about 1 minute. Stir in plenty of stevia.
2. Blend or whisk the milk, protein powder and guar gum until smooth, sprinkling the guar gum in slowly so it doesn't clump. Stir in the blueberries.
3. Pour into a Creami pint, staying below the max fill line. Freeze overnight with the lid on.
4. Run the outside of the pint under hot water for 1 minute to loosen the edges.
5. Spin on **Lite Ice Cream**.
6. Add the almond milk and **Re-spin**.

**Nutrition**

Per pint: 255 kcal · 34 g protein · 25 g carbs · 2.3 g fat

Per 100g: 62 kcal · 8.3 g protein · 6.1 g carbs · 0.6 g fat

**Notes**

- Freezing dulls sweetness, so the base should taste sweeter than you want the ice cream to be.
- Guar gum is what makes it creamy, and a quarter teaspoon is enough.
- Protein powder can make it a bit crumbly after the first spin. The re-spin fixes it, and you can add another splash of almond milk if needed.
- Without the protein powder, it's about 140 kcal and 11 g protein per pint.
- Any frozen fruit works in place of blueberries.

## 75. Strawberry Jelly Glasses

_A soft-set fruit jelly served in glasses and topped with Greek yogurt._

Serves 4 · 45 kcal a glass

Tags: Desserts, Low calorie

**Ingredients**

- 300 g strawberries (fresh or frozen), plus a few for topping
- 2 tbsp lemon juice
- 200 ml water
- 1½ tbsp powdered gelatin (about 14 g)
- Stevia to taste
- 4 tbsp 0% Greek yogurt, to top

**Method**

1. Blend the strawberries, lemon juice and 100 ml of the water until smooth.
2. Sprinkle the gelatin over the remaining 100 ml of cold water and leave for 5 minutes to soften.
3. Warm the gelatin gently, in a small pan or in the microwave for 20–30 seconds, until fully dissolved. Don't let it boil.
4. Whisk the gelatin into the strawberry mix with stevia to taste.
5. Pour into 4 glasses and chill until set, about 3 hours.
6. Top each glass with a spoon of yogurt and a sliced strawberry.

**Nutrition**

Per glass: 45 kcal · 5 g protein · 7 g carbs · 0.3 g fat

Per 100g: 30 kcal · 3.4 g protein · 4.6 g carbs · 0.2 g fat

**Notes**

- For a layered look, set half the jelly for 1 hour, add a layer of yogurt, then pour the rest on top.
- Raspberries, blueberries or orange juice all work. Fresh pineapple, kiwi, papaya, mango and guava can stop gelatin from setting, so use tinned versions of those.

## 76. Banana Chia Pudding

_Made with full-fat milk rather than a low-calorie milk, and split into three small pots instead of two big ones._

Makes 3 pots · 123 kcal a pot

Tags: Desserts, Low calorie

**Ingredients**

- 24 g chia seeds
- 250 ml full-fat milk
- ½ ripe banana (about 60 g), mashed well
- 10 g vanilla protein powder
- ½ tsp cinnamon
- Pinch of salt
- Sweetener to taste

**Method**

1. Mash the banana to a purée — any lumps stay lumps, they don't break down overnight.
2. Whisk everything together in a jug.
3. Leave 10 minutes, then whisk again hard. This second whisk is the important one: chia sinks and sets as a solid lump at the bottom if it's only stirred once.
4. Pour into 3 small glasses and refrigerate at least 4 hours, ideally overnight.

**Nutrition**

Per pot: 123 kcal · 6.7 g protein · 12.3 g carbs · 5.7 g fat

Per 100g: 107 kcal · 5.8 g protein · 10.7 g carbs · 4.9 g fat

**Notes**

- Nearly all the calories are the chia and the milk, not the fruit. Chia is 486 kcal per 100g, so the 24 g here is already 117 kcal before anything else goes in. Adding more chia to thicken it is expensive; leaving it longer in the fridge is free.
- Unsweetened almond milk instead of full-fat drops it to about 80 kcal a pot, but costs 8 g of protein across the batch and tastes thinner. Full-fat is the better pot.
- One Medjool date, soaked and blended, works in place of the banana at 66 kcal against 53. It needs blending properly or you get chewy bits.
- Keeps 4 days in the fridge, so the batch covers most of the week.
- It thickens as it sits. If it sets harder than you like, loosen it with a splash of milk and stir.

## 77. Banana Bread

_No butter, no oil and no sweetener — four very ripe bananas do all of it. More of a breakfast loaf than a cake, which is the point._

Makes 10 slices · 123 kcal a slice

Tags: Desserts, Low calorie

**Ingredients**

- 4 very ripe bananas (about 400 g peeled)
- 150 g plain flour
- 2 eggs
- 100 g 0% Greek yogurt
- 30 g vanilla protein powder
- 1 tsp baking powder
- ½ tsp bicarbonate of soda
- 1½ tsp cinnamon
- ½ tsp salt

**Method**

1. Heat the oven to 180°C and line a 2 lb loaf tin.
2. Mash the bananas properly, to a purée rather than lumps. They are the sugar, the moisture and the fat replacement all at once, so the browner and softer they are the better the loaf.
3. Whisk in the eggs and yogurt.
4. Add the flour, protein powder, baking powder, bicarbonate, cinnamon and salt. Fold until just combined and stop — overmixing is what turns a fat-free cake rubbery.
5. Into the tin and bake 50–60 minutes, checking at 50. A skewer should come out with a crumb or two, not wet batter.
6. Cool 10 minutes in the tin, then turn out and wrap while still slightly warm.

**Nutrition**

Per slice: 123 kcal · 6.3 g protein · 21 g carbs · 1.4 g fat

Per 100g: 181 kcal · 9.3 g protein · 31 g carbs · 2.1 g fat

**Notes**

- A shop or café slice of banana bread is around 320 kcal. Almost the whole difference is the 100 g of butter and 150 g of sugar that aren't in this one.
- No added sweetener at all. With four bananas it is mildly sweet rather than cake-sweet, and tastes like something you'd eat at breakfast.
- Without fat it stales fast. Wrap it while slightly warm and eat it within two days, or slice and freeze it.
- Two tablespoons of oil would improve the crumb noticeably for 24 kcal a slice. Worth it if you aren't counting hard.
- Don't use vital wheat gluten here. This is a quick bread and wants as little gluten as possible — gluten flour would make it tough and chewy.
- For more protein without hurting the crumb: swap one egg for two whites, or take the yogurt up to 150 g. More protein powder is the wrong lever; past 30 g it goes rubbery.
- Chocolate chips add about 20 kcal a slice, walnuts about 26. Both stay under 150.

  else if(el.tagName==='OL'){var i=1;[].forEach.call(el.children,function(li){out.push((i++)+'. '+li.textContent);});}
  else if(el.tagName==='P'){out.push(el.textContent);}
 });
 out.push('');out.push("From Soraya's Kitchen");
 return out.join('\n');
}
if(!navigator.share){[].forEach.call(document.querySelectorAll('.sh[data-act=share]'),function(b){b.hidden=true;});}
document.addEventListener('click',function(e){
 var btn=e.target.closest?e.target.closest('.sh'):null;if(!btn)return;e.preventDefault();
 var card=btn.closest('details.recipe'),text=textOf(card),title=card.querySelector('.title').textContent,act=btn.dataset.act;
 if(act==='whatsapp'){window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');}
 else if(act==='share'){navigator.share({title:title,text:text}).catch(function(){});}
 else if(act==='copy'){
  var done=function(){say('Recipe copied');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,function(){fb(text,done);});}else{fb(text,done);}
 } else if(act==='pdf'){
  [].forEach.call(document.querySelectorAll('.recipe'),function(c){c.classList.remove('print-me');});
  card.classList.add('print-me');card.open=true;
  say('Choose "Save as PDF" in the print menu');
  setTimeout(function(){window.print();},400);
 }
});
function fb(text,done){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(err){say('Could not copy');}document.body.removeChild(ta);}
window.addEventListener('afterprint',function(){[].forEach.call(document.querySelectorAll('.recipe'),function(c){c.classList.remove('print-me');});});

function lcSect(name){
 var re=new RegExp('^## '+name+'\\s*$','m'), i=MD.search(re);
 if(i<0)return [];
 var rest=MD.slice(i).split('\n').slice(1),out=[];
 for(var k=0;k<rest.length;k++){if(/^#{1,2} /.test(rest[k]))break;out.push(rest[k]);}
 return out;
}
function lcRender(ls){
 var h='',ul=[];
 ls.forEach(function(l){
  if(/^- /.test(l)){ul.push('<li>'+inl(l.slice(2))+'</li>');}
  else if(l.trim()){if(ul.length){h+='<ul>'+ul.join('')+'</ul>';ul=[];}h+='<p>'+inl(l.trim())+'</p>';}
 });
 if(ul.length)h+='<ul>'+ul.join('')+'</ul>';
 return h;
}
var how=lcRender(lcSect('How to use this book'));
if(how)document.getElementById('note').innerHTML=how;

 cards.forEach(function(c){

 });
 [].forEach.call(document.querySelectorAll('h2.section'),function(h){

 });

 active=(active===b.dataset.tag)?null:b.dataset.tag;
